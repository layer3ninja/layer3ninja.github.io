# Sveltia CMS configuration — https://sveltiacms.app/en/docs
# Admin panel lives at  https://layer3ninja.github.io/admin/
backend:
  name: github
  repo: layer3ninja/layer3ninja.github.io   # <-- CHANGE ME
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://layer3ninja.github.io          # <-- CHANGE ME
media_folder: docs/assets/images
public_folder: /assets/images

collections:
  # ───────────── Knowledge base ─────────────
  - name: field-stories
    label: "Field Stories"
    label_singular: Note
    folder: docs/field-stories
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for search/SEO)", widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Content, widget: markdown }
  
  - name: layer8-softskills
    label: "layer8-softskills"
    label_singular: Note
    folder: docs/layer8-softskills
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for search/SEO)", widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Content, widget: markdown }


  # ───────────── Single pages ─────────────
  - name: pages
    label: Pages
    files:
      - name: about
        label: About me
        file: docs/about.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: body, label: Content, widget: markdown }
