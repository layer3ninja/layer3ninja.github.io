# Sveltia CMS configuration — https://sveltiacms.app/en/docs
# Admin panel lives at  https://layer3ninja.github.io/admin/
backend:
  name: github
  repo: layer3ninja/layer3ninja.github.io   # <-- CHANGE ME
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://layer3ninja.github.io          # <-- CHANGE ME
media_folder: docs/assets/images
public_folder: /assets/images

collections:
  # ───────────── Blog ─────────────
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: docs/blog/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{date}} — {{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, type: date, time_format: false }
      - { name: draft, label: "Draft (hide from site)", widget: boolean, default: false, required: false }
      - { name: authors, label: Authors, widget: hidden, default: [farshad] }
      - name: categories
        label: Categories
        widget: select
        multiple: true
        options: [CCNA, CCNP, "Routing & Switching", Security, Azure, AWS, "Google Cloud", AI, Labs, Career, Field Stories]
      - { name: tags, label: Tags, widget: list, required: false, hint: "Comma-separated, e.g. OSPF, BGP" }
      - name: body
        label: Post
        widget: markdown
        hint: "Put <!-- more --> after the first paragraph to set the excerpt shown on the blog index."

  # ───────────── Knowledge base ─────────────
  - name: ccna
    label: "CCNA notes"
    label_singular: Note
    folder: docs/ccna
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Short description (for search/SEO)", widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Content, widget: markdown }
