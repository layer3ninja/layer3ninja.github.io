<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Ask early: the cost of waiting grows every minute</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Decide your escalation trigger before you need it (illustrative timelines)</text>
  <line x1="262" y1="110" x2="262" y2="290" stroke="#E2E7ED"/><text x="262" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">0 min</text>
  <line x1="338" y1="110" x2="338" y2="290" stroke="#E2E7ED"/><text x="338" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">15 min</text>
  <line x1="415" y1="110" x2="415" y2="290" stroke="#E2E7ED"/><text x="415" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">30 min</text>
  <line x1="492" y1="110" x2="492" y2="290" stroke="#E2E7ED"/><text x="492" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">45 min</text>
  <line x1="568" y1="110" x2="568" y2="290" stroke="#E2E7ED"/><text x="568" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">60 min</text>
  <line x1="644" y1="110" x2="644" y2="290" stroke="#E2E7ED"/><text x="644" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">75 min</text>
  <line x1="721" y1="110" x2="721" y2="290" stroke="#E2E7ED"/><text x="721" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">90 min</text>
  <line x1="798" y1="110" x2="798" y2="290" stroke="#E2E7ED"/><text x="798" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">105 min</text>
  <line x1="874" y1="110" x2="874" y2="290" stroke="#E2E7ED"/><text x="874" y="306" text-anchor="middle" font-size="11" fill="#5B6B7C">120 min</text>
  <text x="40" y="150" font-size="14" font-weight="700" fill="#C0392B">Wait and struggle</text>
  <text x="40" y="168" font-size="12" fill="#5B6B7C">"I don't want to bother anyone"</text>
  <rect x="262" y="138" width="536" height="26" rx="6" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
  <text x="277" y="156" font-size="12" fill="#C0392B">stuck, guessing, trying things alone</text>
  <circle cx="721" cy="151" r="7" fill="#C0392B"/>
  <text x="721" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">finally asks</text>
  <text x="798" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">fixed: 105 min</text>
  <text x="40" y="240" font-size="14" font-weight="700" fill="#2E7D5B">Timebox, then escalate</text>
  <text x="40" y="258" font-size="12" fill="#5B6B7C">"30 min, no progress: I ask"</text>
  <rect x="262" y="228" width="230" height="26" rx="6" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
  <circle cx="415" cy="241" r="7" fill="#2E7D5B"/>
  <text x="415" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D5B">timebox: escalate</text>
  <text x="492" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">fixed: 45 min</text>
  <text x="502" y="246" font-size="12" fill="#5B6B7C">a colleague had seen it before</text>

  <rect x="40" y="330" width="540" height="246" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
  <text x="58" y="358" font-size="15" font-weight="700" fill="#3B5BA9">The escalation message: three parts</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="58" y="390" font-weight="700">1. What's broken, and the impact</text>
    <text x="74" y="410" fill="#5B6B7C">"Site B is down since 14:10, ~40 users affected."</text>
    <text x="58" y="442" font-weight="700">2. What I've tried and ruled out</text>
    <text x="74" y="462" fill="#5B6B7C">"Uplink is up, routes are there, not the ISP."</text>
    <text x="58" y="494" font-weight="700">3. What I need</text>
    <text x="74" y="514" fill="#5B6B7C">"15 minutes with someone who knows the firewall cluster."</text>
    <text x="58" y="552" font-size="12" fill="#2E7D5B">Shows you've done the work, and gets the right person fast.</text>
  </g>

  <rect x="600" y="330" width="320" height="246" rx="10" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
  <text x="618" y="358" font-size="15" font-weight="700" fill="#B35C00">Even earlier: before the change</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="618" y="392">"I haven't done this on this</text>
    <text x="618" y="410">platform before. Can someone</text>
    <text x="618" y="428">who has look at my plan?"</text>
    <text x="618" y="466" fill="#5B6B7C">Asked a day early: 10 minutes</text>
    <text x="618" y="484" fill="#5B6B7C">of a colleague's time.</text>
    <text x="618" y="514" fill="#5B6B7C">Asked at 2 a.m. mid-outage:</text>
    <text x="618" y="532" fill="#5B6B7C">hours for everyone.</text>
  </g>
</svg>
