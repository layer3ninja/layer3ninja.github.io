<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="620" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Draining a bad ISP with a deny-all route-map</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">The BGP session stays up, but the ISP stops carrying traffic in either direction</text>

  <!-- Cloud -->
  <path d="M420,150 a28,28 0 0 1 20,-46 a36,36 0 0 1 64,-8 a30,30 0 0 1 50,24 a24,24 0 0 1 -6,30 z" fill="#FFFFFF" stroke="#5B6B7C" stroke-width="2"/>
  <text x="482" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2A3A">Internet</text>

  <!-- ISPs -->
  <line x1="430" y1="148" x2="300" y2="210" stroke="#2E7D5B" stroke-width="3"/>
  <line x1="535" y1="148" x2="660" y2="210" stroke="#8A97A6" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="160" y="210" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="250" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D5B">ISP-A</text>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#5B6B7C">healthy · carries all traffic</text>
  <rect x="620" y="210" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <text x="710" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">ISP-B</text>
  <text x="710" y="252" text-anchor="middle" font-size="12" fill="#5B6B7C">loss / instability</text>

  <!-- Router -->
  <line x1="452" y1="320" x2="300" y2="262" stroke="#2E7D5B" stroke-width="4"/>
  <line x1="508" y1="320" x2="660" y2="262" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 5"/>
  <g transform="translate(480,340)">
    <circle r="34" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M-15,-6 L15,-6 M9,-12 L15,-6 L9,0 M15,6 L-15,6 M-9,0 L-15,6 L-9,12" stroke="#1B2A3A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="420" y="345" text-anchor="end" font-size="13" font-weight="600" fill="#1B2A3A">Edge router</text>
  <rect x="588" y="296" width="220" height="24" rx="12" fill="#F8E3E0"/>
  <text x="698" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">route-map DENY-ALL in + out</text>
  <text x="698" y="338" text-anchor="middle" font-size="12" fill="#5B6B7C">session up, nothing exchanged</text>

  <!-- LAN -->
  <line x1="480" y1="374" x2="480" y2="410" stroke="#5B6B7C" stroke-width="3"/>
  <rect x="405" y="410" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <text x="480" y="431" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A3A">Our network</text>
  <text x="480" y="448" text-anchor="middle" font-size="12" fill="#5B6B7C" font-family="Consolas, Menlo, monospace">203.0.113.0/24</text>

  <!-- Direction cards -->
  <rect x="40" y="410" width="340" height="68" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
  <text x="56" y="434" font-size="13" font-weight="700" fill="#3B5BA9">Inbound deny: no routes from ISP-B</text>
  <text x="56" y="456" font-size="13" fill="#1B2A3A">→ our outgoing traffic only has paths</text>
  <text x="70" y="472" font-size="13" fill="#1B2A3A">via ISP-A</text>
  <rect x="40" y="492" width="340" height="68" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
  <text x="56" y="516" font-size="13" font-weight="700" fill="#3B5BA9">Outbound deny: nothing sent to ISP-B</text>
  <text x="56" y="538" font-size="13" fill="#1B2A3A">→ the Internet can only reach our prefix</text>
  <text x="70" y="554" font-size="13" fill="#1B2A3A">via ISP-A</text>

  <!-- Terminal -->
  <rect x="580" y="380" width="340" height="180" rx="10" fill="#1B2A3A"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#E9EDF2" xml:space="preserve">
    <text x="596" y="406" fill="#8FD3B0">R1# show ip bgp summary</text>
    <text x="596" y="434" fill="#8A97A6">Neighbor      AS     PfxRcd</text>
    <text x="596" y="456">192.0.2.1     64500  ~1M (full)</text>
    <text x="596" y="478" fill="#F0A59B">198.51.100.1  64510  0</text>
    <text x="596" y="512" fill="#8A97A6">ISP-B: still Established,</text>
    <text x="596" y="530" fill="#8A97A6">zero prefixes accepted</text>
  </g>

  <text x="40" y="596" font-size="13" fill="#1B2A3A"><tspan font-weight="700">Restoring?</tspan> A full table can take minutes to relearn. Watch PfxRcd climb and settle before calling it done.</text>
</svg>
