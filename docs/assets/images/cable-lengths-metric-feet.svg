<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Feet for metric brains</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">A few rules to remember, and how standard cable sizes line up.</text>

  <!-- Ruler comparison -->
  <rect x="40" y="96" width="880" height="190" rx="12" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="60" y="124" font-size="15" font-weight="700" fill="#2B6CB0">Same scale: 0 to 5 m (0 to about 16.4 ft)</text>
  <!-- metres scale: 0..5 m mapped to x 80..880 (160 px per m) -->
  <line x1="80" y1="170" x2="880" y2="170" stroke="#2B6CB0" stroke-width="3"/>
  <g stroke="#2B6CB0" stroke-width="2"><line x1="80" y1="160" x2="80" y2="180"/><line x1="240" y1="160" x2="240" y2="180"/><line x1="400" y1="160" x2="400" y2="180"/><line x1="560" y1="160" x2="560" y2="180"/><line x1="720" y1="160" x2="720" y2="180"/><line x1="880" y1="160" x2="880" y2="180"/></g>
  <g font-size="12.5" text-anchor="middle" fill="#2B6CB0" font-weight="700"><text x="80" y="152">0 m</text><text x="240" y="152">1 m</text><text x="400" y="152">2 m</text><text x="560" y="152">3 m</text><text x="720" y="152">4 m</text><text x="880" y="152">5 m</text></g>
  <!-- feet scale: 1 ft = 48.77 px -->
  <line x1="80" y1="210" x2="880" y2="210" stroke="#B35C00" stroke-width="3"/>
  <g stroke="#B35C00" stroke-width="2">
    <line x1="80" y1="200" x2="80" y2="220"/><line x1="226.3" y1="200" x2="226.3" y2="220"/><line x1="323.8" y1="200" x2="323.8" y2="220"/><line x1="421.4" y1="200" x2="421.4" y2="220"/><line x1="567.7" y1="200" x2="567.7" y2="220"/><line x1="762.8" y1="200" x2="762.8" y2="220"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#B35C00" font-weight="700"><text x="80" y="238">0 ft</text><text x="226.3" y="238">3 ft</text><text x="323.8" y="238">5 ft</text><text x="421.4" y="238">7 ft</text><text x="567.7" y="238">10 ft</text><text x="762.8" y="238">14 ft</text></g>
  <g font-size="11" text-anchor="middle" fill="#5B6B7C"><text x="226.3" y="256">0.91 m</text><text x="323.8" y="256">1.52 m</text><text x="421.4" y="256">2.13 m</text><text x="567.7" y="256">3.05 m</text><text x="762.8" y="256">4.27 m</text></g>
  <text x="60" y="276" font-size="11.5" font-style="italic" fill="#5B6B7C">Common imperial patch cable sizes, shown against metres.</text>

  <!-- rules -->
  <rect x="40" y="304" width="430" height="296" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
  <text x="60" y="332" font-size="15" font-weight="700" fill="#2E7D5B">Rules to remember</text>
  <g font-size="14" fill="#1B2A3A">
    <text x="60" y="364"><tspan font-weight="700">1 m</tspan> ≈ 3.3 ft (3 ft 3 in)</text>
    <text x="60" y="394"><tspan font-weight="700">1 ft</tspan> ≈ 30 cm (a school ruler)</text>
    <text x="60" y="424"><tspan font-weight="700">10 ft</tspan> ≈ 3 m</text>
    <text x="60" y="454"><tspan font-weight="700">1 in</tspan> = 2.54 cm (4 in ≈ 10 cm)</text>
    <text x="60" y="484"><tspan font-weight="700">1U</tspan> = 1.75 in = 44.45 mm</text>
    <text x="60" y="514"><tspan font-weight="700">19-inch rack</tspan> = 482.6 mm wide</text>
  </g>
  <text x="60" y="556" font-size="13" fill="#1B2A3A">Buying a cable: measure the real path,</text>
  <text x="60" y="576" font-size="13" fill="#1B2A3A">add ~10%, round <tspan font-weight="700">up</tspan> to the next size.</text>

  <rect x="490" y="304" width="430" height="296" rx="12" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
  <text x="510" y="332" font-size="15" font-weight="700" fill="#B35C00">Distance limits</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="510" y="362" font-weight="700">Copper (Cat 5e / 6a)</text>
    <text x="510" y="382">100 m = 328 ft channel</text>
    <text x="510" y="400" fill="#5B6B7C">90 m fixed cable + 10 m patch cords</text>
    <text x="510" y="430" font-weight="700">10GBASE-SR (multimode)</text>
    <text x="510" y="450">OM3 300 m · OM4 400 m</text>
    <text x="510" y="480" font-weight="700">100GBASE-SR4 (multimode)</text>
    <text x="510" y="500">OM3 70 m · OM4 100 m</text>
    <text x="510" y="530" font-weight="700">10GBASE-LR (single-mode)</text>
    <text x="510" y="550">10 km</text>
  </g>
  <text x="510" y="582" font-size="11.5" font-style="italic" fill="#5B6B7C">Panels, splices and dirty connectors eat into these.</text>
</svg>
