<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7C"/></marker>
  </defs>
  <rect width="960" height="566" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Compassion is something you do</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Four steps, from Dutton, Workman &amp; Hardin (2014), with an example from after an outage</text>

  <!-- Steps -->
  <g font-size="13" fill="#1B2A3A">
    <rect x="40" y="104" width="190" height="196" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <circle cx="70" cy="134" r="16" fill="#3B5BA9"/><text x="70" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="96" y="140" font-size="16" font-weight="700" fill="#3B5BA9">Notice</text>
    <text x="56" y="180">A colleague went quiet</text>
    <text x="56" y="198">after the outage their</text>
    <text x="56" y="216">change caused.</text>
    <text x="56" y="270" font-size="12" fill="#5B6B7C">Look up from the console.</text>

    <rect x="270" y="104" width="190" height="196" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <circle cx="300" cy="134" r="16" fill="#3B5BA9"/><text x="300" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="326" y="140" font-size="16" font-weight="700" fill="#3B5BA9">Feel</text>
    <text x="286" y="180">"That must feel awful.</text>
    <text x="286" y="198">I've been there."</text>
    <text x="286" y="270" font-size="12" fill="#5B6B7C">Care, not judgement.</text>

    <rect x="500" y="104" width="190" height="196" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <circle cx="530" cy="134" r="16" fill="#3B5BA9"/><text x="530" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="556" y="140" font-size="16" font-weight="700" fill="#3B5BA9">Make sense</text>
    <text x="516" y="180">They're probably blaming</text>
    <text x="516" y="198">themselves, not ignoring</text>
    <text x="516" y="216">the team.</text>
    <text x="516" y="270" font-size="12" fill="#5B6B7C">Don't assume the worst.</text>

    <rect x="730" y="104" width="190" height="196" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
    <circle cx="760" cy="134" r="16" fill="#2E7D5B"/><text x="760" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <text x="786" y="140" font-size="16" font-weight="700" fill="#2E7D5B">Act</text>
    <text x="746" y="180">Check in privately. Run</text>
    <text x="746" y="198">a blameless review:</text>
    <text x="746" y="216">fix the process, not</text>
    <text x="746" y="234">the person.</text>
    <text x="746" y="270" font-size="12" fill="#5B6B7C">The step that counts.</text>
  </g>
  <line x1="232" y1="202" x2="266" y2="202" stroke="#5B6B7C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="462" y1="202" x2="496" y2="202" stroke="#5B6B7C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="692" y1="202" x2="726" y2="202" stroke="#5B6B7C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Empathy vs compassion -->
  <text x="40" y="344" font-size="15" font-weight="700" fill="#1B2A3A">Why compassion is sustainable and empathic distress isn't</text>
  <text x="40" y="364" font-size="12" fill="#5B6B7C">Based on Singer &amp; Klimecki (2014)</text>

  <rect x="40" y="378" width="430" height="128" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="58" y="406" font-size="15" font-weight="700" fill="#C0392B">Empathic distress: feeling WITH</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="58" y="434">You take on the other person's stress as your own.</text>
    <text x="58" y="456">"Every angry user ruins my day."</text>
    <text x="58" y="490" fill="#C0392B" font-weight="600">→ overwhelm, withdrawal, burnout</text>
  </g>

  <rect x="490" y="378" width="430" height="128" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
  <text x="508" y="406" font-size="15" font-weight="700" fill="#2E7D5B">Compassion: feeling FOR</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="508" y="434">You care about their stress, and stay steady enough</text>
    <text x="508" y="456">to help. "This is hard for them. What can I do?"</text>
    <text x="508" y="490" fill="#2E7D5B" font-weight="600">→ warmth, action, energy to keep going</text>
  </g>

  <text x="40" y="540" font-size="13" fill="#5B6B7C">The same four steps work on yourself after your own mistake: that's self-compassion.</text>
</svg>
