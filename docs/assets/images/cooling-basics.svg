<text x="578" y="554" text-anchor="start" font-size="12.5" fill="#1B2A3A">• Switch ordered with the wrong airflow:</text>
<text x="591" y="574" text-anchor="start" font-size="12.5" fill="#1B2A3A">it blows hot air into the cold aisle.</text>
<text x="578" y="600" text-anchor="start" font-size="12.5" fill="#1B2A3A">• Mixed fan or PSU directions in one chassis.</text>
<text x="578" y="626" text-anchor="start" font-size="12.5" fill="#1B2A3A">• Side-to-side switches in a closed cabinet</text>
<text x="591" y="646" text-anchor="start" font-size="12.5" fill="#1B2A3A">with no baffles.</text>
<text x="578" y="672" text-anchor="start" font-size="12.5" fill="#1B2A3A">• Gaps with no blanking panels.</text>
