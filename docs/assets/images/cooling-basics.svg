<text x="508" y="360" text-anchor="start" font-size="12.5" fill="#1B2A3A">Dedicated unit that runs 24/7, not the building AC.</text>
<text x="508" y="380" text-anchor="start" font-size="12.5" fill="#1B2A3A">Sized for the heat load: 1 kW of IT ≈ 1 kW of heat.</text>
<text x="508" y="400" text-anchor="start" font-size="12.5" fill="#1B2A3A">Alerts on temperature, and a plan for when the AC fails.</text>
