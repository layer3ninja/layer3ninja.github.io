<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="b" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B5BA9"/></marker><marker id="g" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E7D5B"/></marker><marker id="o" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B35C00"/></marker></defs>
<rect width="960" height="700" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">Life of a DNS query: resolving www.example.com</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">Cold cache: nothing is cached yet, so the resolver walks the tree from the root</text>
<rect x="13" y="92" width="164" height="72" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="95" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2A3A">Client</text>
<text x="95" y="138" text-anchor="middle" font-size="12" fill="#5B6B7C">stub resolver</text>
<line x1="95" y1="164" x2="95" y2="555" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="208" y="92" width="164" height="72" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="290" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2A3A">Recursive resolver</text>
<text x="290" y="138" text-anchor="middle" font-size="12" fill="#5B6B7C">internal DNS 10.0.50.20</text>
<text x="290" y="155" text-anchor="middle" font-size="11.5" fill="#B35C00">caches by TTL</text>
<line x1="290" y1="164" x2="290" y2="555" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="418" y="92" width="164" height="72" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="500" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2A3A">Root servers</text>
<text x="500" y="138" text-anchor="middle" font-size="12" fill="#5B6B7C">. (the root)</text>
<line x1="500" y1="164" x2="500" y2="555" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="598" y="92" width="164" height="72" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="680" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2A3A">TLD servers</text>
<text x="680" y="138" text-anchor="middle" font-size="12" fill="#5B6B7C">.com</text>
<line x1="680" y1="164" x2="680" y2="555" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="783" y="92" width="164" height="72" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="865" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1B2A3A">Authoritative</text>
<text x="865" y="138" text-anchor="middle" font-size="12" fill="#5B6B7C">example.com zone</text>
<line x1="865" y1="164" x2="865" y2="555" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="100" y1="205" x2="285" y2="205" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<text x="192.5" y="196" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">A? www.example.com (RD=1)</text>
<circle cx="28" cy="205" r="12" fill="#3B5BA9"/><text x="28" y="209.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
<line x1="295" y1="250" x2="495" y2="250" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<text x="395.0" y="241" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">A? www.example.com</text>
<circle cx="28" cy="250" r="12" fill="#3B5BA9"/><text x="28" y="254.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
<line x1="495" y1="292" x2="295" y2="292" stroke="#B35C00" stroke-width="2.5" marker-end="url(#o)"/>
<text x="395.0" y="283" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">Referral: ask the .com servers</text>
<circle cx="28" cy="292" r="12" fill="#B35C00"/><text x="28" y="296.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text>
<line x1="295" y1="337" x2="675" y2="337" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<text x="485.0" y="328" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">A? www.example.com</text>
<circle cx="28" cy="337" r="12" fill="#3B5BA9"/><text x="28" y="341.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text>
<line x1="675" y1="379" x2="295" y2="379" stroke="#B35C00" stroke-width="2.5" marker-end="url(#o)"/>
<text x="485.0" y="370" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">Referral: ask example.com servers</text>
<circle cx="28" cy="379" r="12" fill="#B35C00"/><text x="28" y="383.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">5</text>
<line x1="295" y1="424" x2="860" y2="424" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<text x="577.5" y="415" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">A? www.example.com</text>
<circle cx="28" cy="424" r="12" fill="#3B5BA9"/><text x="28" y="428.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">6</text>
<line x1="860" y1="466" x2="295" y2="466" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#g)"/>
<text x="577.5" y="457" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">Answer: A 203.0.113.10, TTL 300</text>
<circle cx="28" cy="466" r="12" fill="#2E7D5B"/><text x="28" y="470.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">7</text>
<line x1="285" y1="530" x2="100" y2="530" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#g)"/>
<text x="192.5" y="521" text-anchor="middle" font-size="12.5" fill="#1B2A3A" stroke="#F4F7FA" stroke-width="4" paint-order="stroke">Answer, now cached</text>
<circle cx="28" cy="530" r="12" fill="#2E7D5B"/><text x="28" y="534.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">8</text>
<rect x="30" y="580" width="900" height="100" rx="12" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="50" y="608" font-size="14" fill="#1B2A3A"><tspan font-weight="700" fill="#3B5BA9">Query  </tspan><tspan font-weight="700" fill="#B35C00">Referral  </tspan><tspan font-weight="700" fill="#2E7D5B">Answer</tspan><tspan>  ·  UDP 53, with TCP 53 for large or truncated responses.</tspan></text>
<text x="50" y="634" font-size="14" fill="#1B2A3A"><tspan font-weight="700">Next time: </tspan>the resolver answers from its cache (steps 1 and 8 only) until the TTL runs out.</text>
<text x="50" y="660" font-size="14" fill="#1B2A3A"><tspan font-weight="700">Changing a record? </tspan>Old answers stay in caches for up to the old TTL. Lower the TTL before the change.</text>
</svg>