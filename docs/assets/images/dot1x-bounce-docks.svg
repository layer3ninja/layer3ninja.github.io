<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">802.1X: why a port bounce helps, and why docks get denied</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">Two common surprises when rolling out port authentication</text>
<rect x="30" y="92" width="900" height="240" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="120" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">1. Enabling 802.1X on a port where a device is already connected</text>
<text x="48" y="150" text-anchor="start" font-size="12.5" fill="#C0392B" font-weight="700">Without a bounce</text>
<rect x="48" y="160" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="143.0" y="185.0" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">802.1X enabled</text>
<text x="143.0" y="203.0" text-anchor="middle" font-size="11.5" fill="#5B6B7C">device already up</text>
<rect x="278" y="160" width="200" height="56" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="378.0" y="185.0" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">No link change</text>
<text x="378.0" y="203.0" text-anchor="middle" font-size="11.5" fill="#5B6B7C">supplicant may not start</text>
<rect x="518" y="160" width="200" height="56" rx="10" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<text x="618.0" y="185.0" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">Wait for timeouts</text>
<text x="618.0" y="203.0" text-anchor="middle" font-size="11.5" fill="#5B6B7C">MAB after ~90 s (3 × 30 s)</text>
<rect x="758" y="160" width="155" height="56" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="835.5" y="185.0" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">Slow or stuck</text>
<text x="835.5" y="203.0" text-anchor="middle" font-size="11.5" fill="#5B6B7C">users call the helpdesk</text>
