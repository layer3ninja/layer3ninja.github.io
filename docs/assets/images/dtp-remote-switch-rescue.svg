<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="640" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Locked out by a VLAN change, rescued by DTP</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">A port in dynamic auto follows its neighbour: make the upstream port a trunk, and the link becomes a trunk.</text>

  <!-- Before -->
  <rect x="40" y="96" width="430" height="300" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="60" y="126" font-size="16" font-weight="700" fill="#C0392B">After the mistake: cut off</text>
  <rect x="60" y="146" width="170" height="64" rx="8" fill="#F1F3F5" stroke="#5B6B7C"/>
  <text x="145" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Upstream switch</text>
  <text x="145" y="192" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5B6B7C">Gi1/0/10: access</text>
  <rect x="280" y="146" width="170" height="64" rx="8" fill="#F8E3E0" stroke="#C0392B"/>
  <text x="365" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Remote switch</text>
  <text x="365" y="192" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5B6B7C">Gi1/0/48: dyn auto</text>
  <line x1="230" y1="178" x2="278" y2="178" stroke="#C0392B" stroke-width="3"/>
  <text x="254" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">runs as access</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="60" y="270" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#C0392B">switchport access vlan 30   ← wrong VLAN</text>
    <text x="60" y="302">✗ Management SVI (VLAN 99) unreachable</text>
    <text x="60" y="326">✗ SSH session freezes, nobody on site</text>
    <text x="60" y="350">✓ But the port is still in a dynamic mode…</text>
  </g>

  <!-- After -->
  <rect x="490" y="96" width="430" height="300" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="510" y="126" font-size="16" font-weight="700" fill="#2E7D5B">The rescue: trunk from upstream</text>
  <rect x="510" y="146" width="170" height="64" rx="8" fill="#E6F4EE" stroke="#2E7D5B"/>
  <text x="595" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Upstream switch</text>
  <text x="595" y="192" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#2E7D5B">mode trunk</text>
  <rect x="730" y="146" width="170" height="64" rx="8" fill="#E6F4EE" stroke="#2E7D5B"/>
  <text x="815" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Remote switch</text>
  <text x="815" y="192" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#2E7D5B">dyn auto → trunk</text>
  <line x1="680" y1="172" x2="728" y2="172" stroke="#2E7D5B" stroke-width="5"/>
  <line x1="680" y1="184" x2="728" y2="184" stroke="#2E7D5B" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="704" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D5B">DTP: trunk</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="510" y="270">✓ DTP from upstream asks for a trunk</text>
    <text x="510" y="294">✓ Remote port agrees; access VLAN ignored</text>
    <text x="510" y="318">✓ VLAN 99 tagged on the trunk again</text>
    <text x="510" y="342">✓ SSH is back. Fix the config, then:</text>
    <text x="524" y="364" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#2E7D5B">switchport mode trunk</text>
    <text x="524" y="382" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#2E7D5B">switchport nonegotiate</text>
  </g>

  <!-- DTP table -->
  <rect x="40" y="416" width="560" height="204" rx="12" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="60" y="444" font-size="15" font-weight="700" fill="#2B6CB0">DTP result (local ↓ / neighbour →)</text>
  <g font-size="12.5" fill="#1B2A3A" text-anchor="middle">
    <text x="230" y="474" font-weight="700">auto</text><text x="320" y="474" font-weight="700">desirable</text><text x="410" y="474" font-weight="700">trunk</text><text x="500" y="474" font-weight="700">access</text>
  </g>
  <g font-size="12.5" fill="#1B2A3A">
    <text x="64" y="502" font-weight="700">dynamic auto</text>
    <text x="64" y="530" font-weight="700">dynamic desirable</text>
    <text x="64" y="558" font-weight="700">trunk</text>
    <text x="64" y="586" font-weight="700">access</text>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="230" y="502" fill="#5B6B7C">access</text><text x="320" y="502" fill="#2E7D5B" font-weight="700">trunk</text><text x="410" y="502" fill="#2E7D5B" font-weight="700">trunk</text><text x="500" y="502" fill="#5B6B7C">access</text>
    <text x="230" y="530" fill="#2E7D5B" font-weight="700">trunk</text><text x="320" y="530" fill="#2E7D5B" font-weight="700">trunk</text><text x="410" y="530" fill="#2E7D5B" font-weight="700">trunk</text><text x="500" y="530" fill="#5B6B7C">access</text>
    <text x="230" y="558" fill="#2E7D5B" font-weight="700">trunk</text><text x="320" y="558" fill="#2E7D5B" font-weight="700">trunk</text><text x="410" y="558" fill="#2E7D5B" font-weight="700">trunk</text><text x="500" y="558" fill="#C0392B">mismatch</text>
    <text x="230" y="586" fill="#5B6B7C">access</text><text x="320" y="586" fill="#5B6B7C">access</text><text x="410" y="586" fill="#C0392B">mismatch</text><text x="500" y="586" fill="#5B6B7C">access</text>
  </g>
  <rect x="368" y="488" width="84" height="22" rx="4" fill="none" stroke="#2E7D5B" stroke-width="2"/>
  <text x="60" y="610" font-size="11.5" font-style="italic" fill="#5B6B7C">Our case: remote = dynamic auto, upstream changed to trunk (boxed).</text>

  <rect x="620" y="416" width="300" height="204" rx="12" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
  <text x="640" y="444" font-size="15" font-weight="700" fill="#B35C00">DTP can't help if…</text>
  <g font-size="12.5" fill="#1B2A3A">
    <text x="640" y="472">• remote port is hard-coded access</text>
    <text x="640" y="496">• remote port has nonegotiate</text>
    <text x="640" y="520">• VTP domain names differ</text>
    <text x="640" y="544">• the neighbour isn't Cisco</text>
    <text x="640" y="568">• mgmt VLAN not allowed, or</text>
    <text x="652" y="586">native VLAN mismatch</text>
  </g>
</svg>
