<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7C"/></marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">One port pulled from a port-channel</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">EtherChannel misconfig guard err-disables the side that still thinks it's bundled</text>

  <!-- Switch A -->
  <rect x="60" y="110" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <text x="160" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A3A">Switch A</text>
  <text x="160" y="158" text-anchor="middle" font-size="12" fill="#5B6B7C">where the change was made</text>
  <text x="248" y="186" text-anchor="end" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1B2A3A">Gi1/0/1 · Po1</text>
  <text x="248" y="208" text-anchor="end" font-size="12" font-family="Consolas, Menlo, monospace" fill="#B35C00">Gi1/0/2 · alone</text>

  <!-- Switch B -->
  <rect x="700" y="110" width="200" height="110" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <text x="800" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A3A">Switch B</text>
  <text x="800" y="158" text-anchor="middle" font-size="12" fill="#5B6B7C">no change made here</text>
  <text x="712" y="186" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C0392B">Gi1/0/1 · err-dis</text>
  <text x="712" y="208" font-size="12" font-family="Consolas, Menlo, monospace" fill="#C0392B">Gi1/0/2 · err-dis</text>

  <!-- Links -->
  <line x1="260" y1="182" x2="700" y2="182" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="260" y1="204" x2="700" y2="204" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="300" y="120" width="160" height="40" rx="12" fill="#F6E7D2"/>
  <text x="380" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#B35C00">no channel-group 1</text>
  <text x="380" y="153" text-anchor="middle" font-size="12" fill="#B35C00">on Gi1/0/2 by mistake</text>
  <rect x="490" y="120" width="190" height="40" rx="12" fill="#F8E3E0"/>
  <text x="585" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">Po1 and all members</text>
  <text x="585" y="153" text-anchor="middle" font-size="12" fill="#C0392B">err-disabled: uplink down</text>

  <!-- Terminal -->
  <rect x="40" y="252" width="500" height="168" rx="10" fill="#1B2A3A"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#E9EDF2" xml:space="preserve">
    <text x="56" y="278" fill="#8FD3B0">SwB# show interfaces status err-disabled</text>
    <text x="56" y="306" fill="#8A97A6">Port      Status        Reason</text>
    <text x="56" y="328" fill="#F0A59B">Gi1/0/1   err-disabled  channel-misconfig (STP)</text>
    <text x="56" y="350" fill="#F0A59B">Gi1/0/2   err-disabled  channel-misconfig (STP)</text>
    <text x="56" y="386" fill="#8A97A6">One command tells you which ports and why.</text>
    <text x="56" y="404" fill="#8A97A6">No log-reading or port-by-port guessing.</text>
  </g>

  <!-- Auto-recovery -->
  <rect x="560" y="252" width="360" height="168" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
  <text x="578" y="278" font-size="14" font-weight="700" fill="#3B5BA9">errdisable recovery (if enabled)</text>
  <g font-size="12.5" fill="#1B2A3A">
    <rect x="578" y="294" width="96" height="40" rx="8" fill="#F8E3E0"/>
    <text x="626" y="319" text-anchor="middle" font-weight="600" fill="#C0392B">err-disabled</text>
    <rect x="702" y="294" width="96" height="40" rx="8" fill="#E7ECF7"/>
    <text x="750" y="313" text-anchor="middle" font-weight="600" fill="#3B5BA9">wait 300 s</text>
    <text x="750" y="328" text-anchor="middle" font-size="11" fill="#5B6B7C">(default)</text>
    <rect x="826" y="294" width="80" height="40" rx="8" fill="#E9EDF2"/>
    <text x="866" y="319" text-anchor="middle" font-weight="600">retry</text>
    <text x="578" y="368" fill="#2E7D5B" font-weight="600">Config fixed → port comes back on its own</text>
    <text x="578" y="390" fill="#C0392B" font-weight="600">Not fixed → err-disabled again (flapping)</text>
    <text x="578" y="410" font-size="12" fill="#5B6B7C">A safety net, not a fix.</text>
  </g>
  <line x1="676" y1="314" x2="698" y2="314" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="314" x2="822" y2="314" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>

  <!-- Steps -->
  <text x="40" y="458" font-size="15" font-weight="700" fill="#1B2A3A">Getting the uplink back</text>
  <g font-size="13" fill="#1B2A3A">
    <rect x="40" y="472" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="58" y="498" font-weight="700" fill="#2E7D5B">1 · Find it</text>
    <text x="58" y="522" font-family="Consolas, Menlo, monospace" font-size="12">show int status err-disabled</text>
    <text x="58" y="544" font-family="Consolas, Menlo, monospace" font-size="12">show etherchannel summary</text>

    <rect x="340" y="472" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="358" y="498" font-weight="700" fill="#2E7D5B">2 · Fix the config first</text>
    <text x="358" y="522">Put the port back in the channel,</text>
    <text x="358" y="540">or remove it on both sides.</text>

    <rect x="640" y="472" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="658" y="498" font-weight="700" fill="#2E7D5B">3 · Bring it back</text>
    <text x="658" y="522"><tspan font-family="Consolas, Menlo, monospace" font-size="12">shutdown</tspan> / <tspan font-family="Consolas, Menlo, monospace" font-size="12">no shutdown</tspan></text>
    <text x="658" y="540">or let auto-recovery retry.</text>
  </g>
</svg>
