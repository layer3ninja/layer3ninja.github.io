<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="960" height="660" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Which ASN goes where on ExpressRoute?</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">It depends on the peering. Microsoft's side is always AS 12076.</text>

  <!-- On-prem router -->
  <rect x="40" y="110" width="200" height="230" rx="12" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="140" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#2B6CB0">Your edge routers</text>
  <rect x="62" y="158" width="156" height="44" rx="8" fill="#EAF1FB" stroke="#2B6CB0"/>
  <text x="140" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Router 1</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#5B6B7C">.129 (first IP)</text>
  <rect x="62" y="252" width="156" height="44" rx="8" fill="#EAF1FB" stroke="#2B6CB0"/>
  <text x="140" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Router 2</text>
  <text x="140" y="288" text-anchor="middle" font-size="11" fill="#5B6B7C">.133 (first IP)</text>
  <text x="140" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2B6CB0">AS 65010</text>

  <!-- MSEE -->
  <rect x="720" y="110" width="200" height="230" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
  <text x="820" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D5B">Microsoft edge</text>
  <rect x="742" y="158" width="156" height="44" rx="8" fill="#E6F4EE" stroke="#2E7D5B"/>
  <text x="820" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">MSEE primary</text>
  <text x="820" y="194" text-anchor="middle" font-size="11" fill="#5B6B7C">.130 (second IP)</text>
  <rect x="742" y="252" width="156" height="44" rx="8" fill="#E6F4EE" stroke="#2E7D5B"/>
  <text x="820" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">MSEE secondary</text>
  <text x="820" y="288" text-anchor="middle" font-size="11" fill="#5B6B7C">.134 (second IP)</text>
  <text x="820" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2E7D5B">AS 12076</text>

  <line x1="218" y1="180" x2="742" y2="180" stroke="#5B6B7C" stroke-width="2.5"/>
  <line x1="218" y1="274" x2="742" y2="274" stroke="#5B6B7C" stroke-width="2.5"/>
  <text x="480" y="170" text-anchor="middle" font-size="12" fill="#5B6B7C">eBGP · 192.168.100.128/30</text>
  <text x="480" y="264" text-anchor="middle" font-size="12" fill="#5B6B7C">eBGP · 192.168.100.132/30</text>
  <text x="480" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B2A3A">Both sessions needed for the SLA</text>

  <!-- rules -->
  <rect x="40" y="362" width="430" height="150" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
  <text x="60" y="390" font-size="15" font-weight="700" fill="#2E7D5B">Azure private peering (VNets)</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="60" y="418">✓ Private ASN is fine (2- or 4-byte)</text>
    <text x="60" y="442">✓ Private or public /30s</text>
    <text x="60" y="466">✗ Not 65515–65520 (reserved by Azure)</text>
    <text x="60" y="490">• Max 4,000 prefixes (10,000 Premium)</text>
  </g>
  <rect x="490" y="362" width="430" height="150" rx="12" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
  <text x="510" y="390" font-size="15" font-weight="700" fill="#B35C00">Microsoft peering (M365, public PaaS)</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="510" y="418">• Public /30s that you own</text>
    <text x="510" y="442">• Public ASN registered to you (ARIN, RIPE…)</text>
    <text x="510" y="466">• Private ASN: manual validation, and</text>
    <text x="524" y="484">stripped from the AS path</text>
  </g>

  <!-- trap -->
  <rect x="40" y="530" width="880" height="110" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="60" y="558" font-size="15" font-weight="700" fill="#C0392B">The trap: the same private ASN at every site</text>
  <rect x="60" y="574" width="150" height="46" rx="8" fill="#F8E3E0" stroke="#C0392B"/>
  <text x="135" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Site A</text>
  <text x="135" y="610" text-anchor="middle" font-size="11" fill="#C0392B">AS 65010</text>
  <line x1="212" y1="597" x2="378" y2="597" stroke="#C0392B" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="295" y="589" text-anchor="middle" font-size="11" fill="#5B6B7C">via Azure / Global Reach</text>
  <rect x="384" y="574" width="150" height="46" rx="8" fill="#F8E3E0" stroke="#C0392B"/>
  <text x="459" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Site B</text>
  <text x="459" y="610" text-anchor="middle" font-size="11" fill="#C0392B">AS 65010</text>
  <text x="556" y="592" font-size="12.5" fill="#1B2A3A">Sees its own ASN in the path → drops the routes.</text>
  <text x="556" y="612" font-size="12.5" font-weight="700" fill="#2E7D5B">Fix: a unique ASN per site.</text>
</svg>
