<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker>
  </defs>
  <rect width="960" height="620" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Let's Encrypt on a BIG-IP: the renewal chain</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Every link is a dependency. Break one, and the certificate quietly runs out weeks later.</text>

  <g text-anchor="middle">
    <rect x="40" y="100" width="160" height="96" rx="10" fill="#EAF1FB" stroke="#2B6CB0" stroke-width="2"/>
    <text x="120" y="126" font-size="13" font-weight="700" fill="#2B6CB0">1. Schedule</text>
    <text x="120" y="150" font-size="12" fill="#1B2A3A">iCall / cron</text>
    <text x="120" y="170" font-size="12" fill="#1B2A3A">starts the script</text>

    <rect x="222" y="100" width="160" height="96" rx="10" fill="#EAF1FB" stroke="#2B6CB0" stroke-width="2"/>
    <text x="302" y="126" font-size="13" font-weight="700" fill="#2B6CB0">2. Order</text>
    <text x="302" y="150" font-size="12" fill="#1B2A3A">BIG-IP → Let's Encrypt</text>
    <text x="302" y="170" font-size="12" fill="#1B2A3A">outbound HTTPS</text>

    <rect x="404" y="100" width="160" height="96" rx="10" fill="#EAF1FB" stroke="#2B6CB0" stroke-width="2"/>
    <text x="484" y="126" font-size="13" font-weight="700" fill="#2B6CB0">3. HTTP-01</text>
    <text x="484" y="150" font-size="12" fill="#1B2A3A">LE → port 80 VIP</text>
    <text x="484" y="170" font-size="12" fill="#1B2A3A">iRule answers token</text>

    <rect x="586" y="100" width="160" height="96" rx="10" fill="#EAF1FB" stroke="#2B6CB0" stroke-width="2"/>
    <text x="666" y="126" font-size="13" font-weight="700" fill="#2B6CB0">4. Install</text>
    <text x="666" y="150" font-size="12" fill="#1B2A3A">cert + key imported,</text>
    <text x="666" y="170" font-size="12" fill="#1B2A3A">client SSL profile</text>

    <rect x="768" y="100" width="152" height="96" rx="10" fill="#EAF1FB" stroke="#2B6CB0" stroke-width="2"/>
    <text x="844" y="126" font-size="13" font-weight="700" fill="#2B6CB0">5. Save + sync</text>
    <text x="844" y="150" font-size="12" fill="#1B2A3A">save config,</text>
    <text x="844" y="170" font-size="12" fill="#1B2A3A">sync HA peer</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2"><line x1="200" y1="148" x2="220" y2="148" marker-end="url(#b)"/><line x1="382" y1="148" x2="402" y2="148" marker-end="url(#b)"/><line x1="564" y1="148" x2="584" y2="148" marker-end="url(#b)"/><line x1="746" y1="148" x2="766" y2="148" marker-end="url(#b)"/></g>

  <!-- failure cards -->
  <g font-size="12" fill="#1B2A3A">
    <rect x="40" y="212" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
    <text x="52" y="236" font-weight="700" fill="#C0392B">Breaks when</text>
    <text x="52" y="260">cron lost after a</text><text x="52" y="278">TMOS upgrade</text>
    <text x="52" y="306" fill="#2E7D5B" font-weight="700">Fix:</text><text x="52" y="324">iCall handler,</text><text x="52" y="342">script in /shared</text>

    <rect x="222" y="212" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
    <text x="234" y="236" font-weight="700" fill="#C0392B">Breaks when</text>
    <text x="234" y="260">new outbound rule,</text><text x="234" y="278">proxy, route change</text>
    <text x="234" y="306" fill="#2E7D5B" font-weight="700">Fix:</text><text x="234" y="324">document the flow;</text><text x="234" y="342">test after changes</text>

    <rect x="404" y="212" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
    <text x="416" y="236" font-weight="700" fill="#C0392B">Breaks when</text>
    <text x="416" y="260">port 80 VIP removed,</text><text x="416" y="278">redirect runs first,</text><text x="416" y="296">geo-blocking</text>
    <text x="416" y="320" fill="#2E7D5B" font-weight="700">Fix:</text><text x="416" y="338">iRule priority,</text><text x="416" y="354">or DNS-01</text>

    <rect x="586" y="212" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
    <text x="598" y="236" font-weight="700" fill="#C0392B">Breaks when</text>
    <text x="598" y="260">profile or cert</text><text x="598" y="278">renamed by hand</text>
    <text x="598" y="306" fill="#2E7D5B" font-weight="700">Fix:</text><text x="598" y="324">keep names stable;</text><text x="598" y="342">note them in config</text>

    <rect x="768" y="212" width="152" height="150" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
    <text x="780" y="236" font-weight="700" fill="#C0392B">Breaks when</text>
    <text x="780" y="260">renewed on one unit,</text><text x="780" y="278">never saved/synced</text>
    <text x="780" y="306" fill="#2E7D5B" font-weight="700">Fix:</text><text x="780" y="324">check both units</text><text x="780" y="342">after renewal</text>
  </g>

  <!-- timeline -->
  <rect x="40" y="382" width="880" height="218" rx="12" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
  <text x="60" y="410" font-size="15" font-weight="700" fill="#B35C00">Nobody warns you any more, and the window is shrinking</text>
  <line x1="80" y1="470" x2="880" y2="470" stroke="#A7B1BC" stroke-width="3"/>
  <g font-size="12.5" text-anchor="middle">
    <circle cx="160" cy="470" r="8" fill="#C0392B"/>
    <text x="160" y="448" font-weight="700" fill="#1B2A3A">June 4, 2025</text>
    <text x="160" y="496" fill="#1B2A3A">Expiry emails</text><text x="160" y="514" fill="#1B2A3A">stopped</text>
    <circle cx="480" cy="470" r="8" fill="#B35C00"/>
    <text x="480" y="448" font-weight="700" fill="#1B2A3A">Feb 10, 2027</text>
    <text x="480" y="496" fill="#1B2A3A">Default lifetime</text><text x="480" y="514" fill="#1B2A3A">90 → 64 days</text>
    <circle cx="780" cy="470" r="8" fill="#B35C00"/>
    <text x="780" y="448" font-weight="700" fill="#1B2A3A">2028</text>
    <text x="780" y="496" fill="#1B2A3A">Default lifetime</text><text x="780" y="514" fill="#1B2A3A">→ 45 days</text>
  </g>
  <text x="60" y="556" font-size="13" fill="#1B2A3A">Monitor from outside:</text>
  <text x="210" y="556" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1B2A3A">openssl s_client -connect www.example.com:443 … | openssl x509 -noout -enddate</text>
  <text x="60" y="582" font-size="13" fill="#1B2A3A">On the BIG-IP:</text>
  <text x="210" y="582" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1B2A3A">tmsh run sys crypto check-cert</text>
</svg>
