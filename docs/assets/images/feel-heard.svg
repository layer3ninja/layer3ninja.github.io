<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Three ways to answer an upset user</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">In an experiment, reflecting back made people feel the most understood (Weger et al., 2014)</text>

  <!-- User -->
  <g transform="translate(205,128)">
    <circle cx="0" cy="-12" r="11" fill="#5B6B7C"/>
    <path d="M-20,22 Q-20,2 0,2 Q20,2 20,22 Z" fill="#5B6B7C"/>
  </g>
  <rect x="240" y="100" width="520" height="54" rx="14" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <path d="M240,122 L228,128 L240,134" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <line x1="241" y1="123" x2="241" y2="133" stroke="#FFFFFF" stroke-width="3"/>
  <text x="500" y="133" text-anchor="middle" font-size="15" fill="#1B2A3A">"My VPN keeps dropping, and I've lost my work twice today!"</text>

  <!-- Connectors -->
  <path d="M500,154 L500,172 L180,172 L180,198" fill="none" stroke="#8A97A6" stroke-width="2"/>
  <line x1="480" y1="172" x2="480" y2="198" stroke="#8A97A6" stroke-width="2"/>
  <path d="M500,172 L780,172 L780,198" fill="none" stroke="#8A97A6" stroke-width="2"/>

  <!-- Card 1 -->
  <rect x="40" y="198" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="2"/>
  <path d="M40,208 a10,10 0 0 1 10,-10 h260 a10,10 0 0 1 10,10 v28 h-280 z" fill="#E9EDF2"/>
  <text x="58" y="223" font-size="14" font-weight="700" fill="#5B6B7C">Simple acknowledgement</text>
  <text x="58" y="268" font-size="14" fill="#1B2A3A">"OK, I'll check."</text>
  <line x1="58" y1="352" x2="302" y2="352" stroke="#E9EDF2" stroke-width="2"/>
  <text x="58" y="376" font-size="13" font-weight="600" fill="#5B6B7C">User thinks: did they get it?</text>

  <!-- Card 2 -->
  <rect x="340" y="198" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
  <path d="M340,208 a10,10 0 0 1 10,-10 h260 a10,10 0 0 1 10,10 v28 h-280 z" fill="#F6E7D2"/>
  <text x="358" y="223" font-size="14" font-weight="700" fill="#B35C00">Jump straight to advice</text>
  <text x="358" y="268" font-size="14" fill="#1B2A3A">"Try restarting your laptop."</text>
  <line x1="358" y1="352" x2="602" y2="352" stroke="#F6E7D2" stroke-width="2"/>
  <text x="358" y="376" font-size="13" font-weight="600" fill="#B35C00">User thinks: they didn't listen.</text>

  <!-- Card 3 -->
  <rect x="640" y="198" width="280" height="200" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="3"/>
  <path d="M640,208 a10,10 0 0 1 10,-10 h260 a10,10 0 0 1 10,10 v28 h-280 z" fill="#E3F1EA"/>
  <text x="658" y="223" font-size="14" font-weight="700" fill="#2E7D5B">Reflect, then act</text>
  <g font-size="14" fill="#1B2A3A">
    <text x="658" y="268">"So it drops mid-session and</text>
    <text x="658" y="288">you've lost work twice today.</text>
    <text x="658" y="308">That's really disruptive. Is it</text>
    <text x="658" y="328">only on Wi-Fi, or wired too?"</text>
  </g>
  <line x1="658" y1="352" x2="902" y2="352" stroke="#E3F1EA" stroke-width="2"/>
  <text x="658" y="376" font-size="13" font-weight="600" fill="#2E7D5B">User thinks: they understand.</text>

  <!-- Formula -->
  <text x="40" y="446" font-size="15" font-weight="700" fill="#1B2A3A">The three-sentence formula</text>
  <g>
    <path d="M40,462 H300 L322,502 L300,542 H40 Z" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="58" y="490" font-size="14" font-weight="700" fill="#2E7D5B">1 · Paraphrase the problem</text>
    <text x="58" y="514" font-size="13" fill="#1B2A3A">"So since this morning, your</text>
    <text x="58" y="531" font-size="13" fill="#1B2A3A">VPN drops every few minutes."</text>

    <path d="M332,462 H600 L622,502 L600,542 H332 L354,502 Z" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="368" y="490" font-size="14" font-weight="700" fill="#2E7D5B">2 · Name the impact</text>
    <text x="368" y="514" font-size="13" fill="#1B2A3A">"...and you've lost work twice.</text>
    <text x="368" y="531" font-size="13" fill="#1B2A3A">That's really disruptive."</text>

    <path d="M632,462 H920 V542 H632 L654,502 Z" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="670" y="490" font-size="14" font-weight="700" fill="#2E7D5B">3 · Confirm + next step</text>
    <text x="670" y="514" font-size="13" fill="#1B2A3A">"Did I get that right? I'm</text>
    <text x="670" y="531" font-size="13" fill="#1B2A3A">checking the VPN logs now."</text>
  </g>
  <text x="40" y="578" font-size="13" fill="#5B6B7C">About 15 seconds of effort. Then fix the problem.</text>
</svg>
