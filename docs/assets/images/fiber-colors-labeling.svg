<rect width="960" height="680" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">Fiber at a glance: colors, strand order, and labels</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">Jacket and connector colors tell you the fiber type; strand colors and labels tell you where it goes</text>
<rect x="30" y="92" width="440" height="230" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="120" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">Jacket color (TIA-598)</text>
<rect x="48" y="138" width="70" height="20" rx="10" fill="#F2C700" stroke="#5B6B7C" stroke-width="1"/>
<text x="130" y="153" text-anchor="start" font-size="13" fill="#1B2A3A" font-weight="700">OS1 / OS2</text>
<text x="232" y="153" text-anchor="start" font-size="12" fill="#5B6B7C">single-mode 9/125 µm</text>
<rect x="48" y="173" width="70" height="20" rx="10" fill="#F28C28" stroke="#5B6B7C" stroke-width="1"/>
<text x="130" y="188" text-anchor="start" font-size="13" fill="#1B2A3A" font-weight="700">OM1 / OM2</text>
<text x="232" y="188" text-anchor="start" font-size="12" fill="#5B6B7C">multimode 62.5 or 50 µm</text>
<rect x="48" y="208" width="70" height="20" rx="10" fill="#3EC1C9" stroke="#5B6B7C" stroke-width="1"/>
<text x="130" y="223" text-anchor="start" font-size="13" fill="#1B2A3A" font-weight="700">OM3 / OM4</text>
<text x="232" y="223" text-anchor="start" font-size="12" fill="#5B6B7C">multimode 50/125 µm</text>
<rect x="48" y="243" width="70" height="20" rx="10" fill="#B565A7" stroke="#5B6B7C" stroke-width="1"/>
<text x="130" y="258" text-anchor="start" font-size="13" fill="#1B2A3A" font-weight="700">OM4 (violet)</text>
<text x="232" y="258" text-anchor="start" font-size="12" fill="#5B6B7C">used by some vendors</text>
<rect x="48" y="278" width="70" height="20" rx="10" fill="#9ACD32" stroke="#5B6B7C" stroke-width="1"/>
<text x="130" y="293" text-anchor="start" font-size="13" fill="#1B2A3A" font-weight="700">OM5</text>
<text x="232" y="293" text-anchor="start" font-size="12" fill="#5B6B7C">wideband multimode</text>
<text x="48" y="316" text-anchor="start" font-size="11.5" fill="#C0392B">Color is a hint, not proof: always check the print on the jacket.</text>
<rect x="490" y="92" width="440" height="230" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="508" y="120" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">Connector color</text>
