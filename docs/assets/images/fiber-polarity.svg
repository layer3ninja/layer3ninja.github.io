<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Fiber polarity: every Tx must land on an Rx</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">A duplex fiber link has two strands, one for each direction</text>
  <rect x="40" y="96" width="420" height="250" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="60" y="126" font-size="17" font-weight="700" fill="#2E7D5B">Correct (A-to-B)</text>
  <rect x="60" y="150" width="110" height="140" rx="8" fill="#E9EDF2" stroke="#1B2A3A" stroke-width="1.5"/>
  <text x="115" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Switch A</text>
  <rect x="330" y="150" width="110" height="140" rx="8" fill="#E9EDF2" stroke="#1B2A3A" stroke-width="1.5"/>
  <text x="385" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Switch B</text>
  <rect x="136" y="193" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="153" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Tx</text>
  <rect x="136" y="243" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="153" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Rx</text>
  <rect x="330" y="193" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="347" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Rx</text>
  <rect x="330" y="243" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="347" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Tx</text>
  <line x1="170" y1="205" x2="330" y2="205" stroke="#2E7D5B" stroke-width="3"/>
  <line x1="330" y1="255" x2="170" y2="255" stroke="#2E7D5B" stroke-width="3"/>
  <text x="250" y="197" text-anchor="middle" font-size="12" fill="#2E7D5B">A Tx → B Rx</text>
  <text x="250" y="276" text-anchor="middle" font-size="12" fill="#2E7D5B">A Rx ← B Tx</text>
  <text x="250" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D5B">Light reaches both receivers: link up</text>
  <rect x="500" y="96" width="420" height="250" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <text x="520" y="126" font-size="17" font-weight="700" fill="#C0392B">Swapped polarity</text>
  <rect x="520" y="150" width="110" height="140" rx="8" fill="#E9EDF2" stroke="#1B2A3A" stroke-width="1.5"/>
  <text x="575" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Switch A</text>
  <rect x="790" y="150" width="110" height="140" rx="8" fill="#E9EDF2" stroke="#1B2A3A" stroke-width="1.5"/>
  <text x="845" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Switch B</text>
  <rect x="596" y="193" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="613" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Tx</text>
  <rect x="596" y="243" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="613" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Rx</text>
  <rect x="790" y="193" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="807" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Tx</text>
  <rect x="790" y="243" width="34" height="24" rx="4" fill="#FFFFFF" stroke="#5B6B7C"/><text x="807" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1B2A3A">Rx</text>
  <line x1="630" y1="205" x2="790" y2="205" stroke="#C0392B" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="630" y1="255" x2="790" y2="255" stroke="#C0392B" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="710" y="197" text-anchor="middle" font-size="12" fill="#C0392B">Tx → Tx</text>
  <text x="710" y="276" text-anchor="middle" font-size="12" fill="#C0392B">Rx ↔ Rx (dark)</text>
  <text x="710" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">No light at either receiver: link down</text>

  <rect x="40" y="368" width="440" height="200" rx="10" fill="#1B2A3A"/>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#E9EDF2" xml:space="preserve">
    <text x="56" y="394" fill="#8FD3B0">SwA# show interfaces Te1/0/1 transceiver</text>
    <text x="56" y="422" fill="#8A97A6">Port     Temp   Tx Pwr   Rx Pwr</text>
    <text x="56" y="440" fill="#8A97A6">                (dBm)    (dBm)</text>
    <text x="56" y="464">Te1/0/1  31.2   -2.1     <tspan fill="#F0A59B">-40.0</tspan></text>
    <text x="56" y="500" fill="#8A97A6">Tx looks healthy, Rx is ~-40 dBm:</text>
    <text x="56" y="518" fill="#8A97A6">this optic is sending light,</text>
    <text x="56" y="536" fill="#8A97A6">but none is arriving.</text>
  </g>

  <text x="500" y="392" font-size="15" font-weight="700" fill="#1B2A3A">The fix</text>
  <g font-size="13" fill="#1B2A3A">
    <rect x="500" y="404" width="420" height="44" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="516" y="431"><tspan font-weight="700" fill="#2E7D5B">1</tspan>  Flip the LC duplex clip (or swap the two connectors)</text>
    <rect x="500" y="456" width="420" height="44" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="516" y="483"><tspan font-weight="700" fill="#2E7D5B">2</tspan>  Fix it at one end only, usually the patch cord</text>
    <rect x="500" y="508" width="420" height="44" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
    <text x="516" y="535"><tspan font-weight="700" fill="#2E7D5B">3</tspan>  Re-check Rx: typically about -1 to -10 dBm</text>
  </g>
</svg>
