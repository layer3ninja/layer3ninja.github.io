<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Silence vs. a first touch</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">How stress builds over the life of a ticket (illustrative, not measured data)</text>

  <!-- Axes -->
  <line x1="90" y1="120" x2="90" y2="380" stroke="#5B6B7C" stroke-width="2"/>
  <line x1="90" y1="380" x2="905" y2="380" stroke="#5B6B7C" stroke-width="2"/>
  <path d="M84,128 L90,116 L96,128" fill="none" stroke="#5B6B7C" stroke-width="2"/>
  <path d="M897,374 L909,380 L897,386" fill="none" stroke="#5B6B7C" stroke-width="2"/>
  <text x="62" y="250" font-size="13" fill="#5B6B7C" text-anchor="middle" transform="rotate(-90 62 250)">Stress (user and engineer)</text>

  <!-- Event ticks -->
  <g font-size="12" fill="#5B6B7C" text-anchor="middle">
    <line x1="110" y1="380" x2="110" y2="388" stroke="#5B6B7C" stroke-width="2"/><text x="110" y="402">Ticket opened</text>
    <line x1="230" y1="380" x2="230" y2="388" stroke="#5B6B7C" stroke-width="2"/><text x="230" y="402">First touch</text>
    <line x1="560" y1="380" x2="560" y2="388" stroke="#5B6B7C" stroke-width="2"/><text x="560" y="402">Update</text>
    <line x1="880" y1="380" x2="880" y2="388" stroke="#5B6B7C" stroke-width="2"/><text x="866" y="402">Resolved</text>
  </g>

  <!-- Silent curve -->
  <path d="M110,300 C220,290 330,240 430,205 C530,172 640,150 760,138 C820,132 850,140 862,170 C870,260 875,330 890,360" fill="none" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="372" y="160" width="118" height="24" rx="12" fill="#F8E3E0"/>
  <text x="431" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">"Any update??"</text>
  <rect x="650" y="100" width="110" height="24" rx="12" fill="#F8E3E0"/>
  <text x="705" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">Escalation</text>

  <!-- First-touch curve -->
  <path d="M110,300 C150,290 190,280 230,290 C260,315 300,325 360,322 C450,318 520,315 560,322 C620,330 700,328 800,330 C840,332 860,340 890,360" fill="none" stroke="#2E7D5B" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="230" cy="290" r="6" fill="#2E7D5B"/>
  <circle cx="560" cy="322" r="6" fill="#2E7D5B"/>
  <rect x="176" y="334" width="108" height="24" rx="12" fill="#E3F1EA"/>
  <text x="230" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D5B">Ack + ETA</text>
  <rect x="506" y="334" width="108" height="24" rx="12" fill="#E3F1EA"/>
  <text x="560" y="351" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D5B">Update sent</text>

  <!-- Legend -->
  <line x1="90" y1="432" x2="124" y2="432" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/>
  <text x="134" y="437" font-size="13" fill="#1B2A3A">No response until it's fixed: uncertainty keeps rising</text>
  <line x1="520" y1="432" x2="554" y2="432" stroke="#2E7D5B" stroke-width="3.5" stroke-linecap="round"/>
  <text x="564" y="437" font-size="13" fill="#1B2A3A">First touch, then regular updates</text>

  <!-- Three moves -->
  <g>
    <rect x="90" y="462" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="108" y="490" font-size="15" font-weight="700" fill="#2E7D5B">1 · Acknowledge</text>
    <text x="108" y="516" font-size="13" fill="#1B2A3A">"Got it, I'm on it."</text>
    <text x="108" y="534" font-size="13" fill="#1B2A3A">Ends the guessing.</text>

    <rect x="355" y="462" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="373" y="490" font-size="15" font-weight="700" fill="#2E7D5B">2 · Ask one question</text>
    <text x="373" y="516" font-size="13" fill="#1B2A3A">"Is it one PC or the whole</text>
    <text x="373" y="534" font-size="13" fill="#1B2A3A">floor?" Shows real work started.</text>

    <rect x="620" y="462" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="638" y="490" font-size="15" font-weight="700" fill="#2E7D5B">3 · Set a timeline</text>
    <text x="638" y="516" font-size="13" fill="#1B2A3A">"Next update by 14:00, even</text>
    <text x="638" y="534" font-size="13" fill="#1B2A3A">if it's not fixed yet."</text>
  </g>
</svg>
