<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="b" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B5BA9"/></marker><marker id="g" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E7D5B"/></marker><marker id="o" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B35C00"/></marker><marker id="r" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker><marker id="k" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6B7C"/></marker><marker id="t" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1B2A3A"/></marker></defs>
<rect width="960" height="700" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">FortiGate: why asymmetric traffic gets dropped</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">Traffic arrives on one interface, but the FortiGate's route back to the source points out another</text>
<rect x="30" y="92" width="900" height="300" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<rect x="60" y="180" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="140.0" y="211.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">Remote site</text>
<text x="140.0" y="230.0" text-anchor="middle" font-size="12" fill="#5B6B7C">10.50.0.0/16</text>
<rect x="300" y="110" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="385.0" y="138.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">MPLS router</text>
<text x="385.0" y="157.0" text-anchor="middle" font-size="12" fill="#5B6B7C">path A</text>
<rect x="300" y="262" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="385.0" y="290.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">IPsec / SD-WAN</text>
<text x="385.0" y="309.0" text-anchor="middle" font-size="12" fill="#5B6B7C">path B</text>
<rect x="560" y="170" width="170" height="92" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="645" y="200" text-anchor="middle" font-size="15" fill="#1B2A3A" font-weight="700">FortiGate</text>
<text x="645" y="222" text-anchor="middle" font-size="12" fill="#5B6B7C">port3 = MPLS</text>
<text x="645" y="240" text-anchor="middle" font-size="12" fill="#5B6B7C">port1 = IPsec</text>
<rect x="790" y="180" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="850.0" y="211.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">LAN</text>
<text x="850.0" y="230.0" text-anchor="middle" font-size="12" fill="#5B6B7C">10.10.10.0/24</text>
<line x1="222" y1="200" x2="296" y2="150" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<line x1="472" y1="142" x2="556" y2="196" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<text x="500" y="140" text-anchor="start" font-size="11.5" fill="#3B5BA9">packet arrives</text>
<text x="500" y="155" text-anchor="start" font-size="11.5" fill="#3B5BA9">on port3</text>
<path d="M556 240 L472 292" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
<text x="500" y="300" text-anchor="start" font-size="11.5" fill="#C0392B">but the route to</text>
<text x="500" y="315" text-anchor="start" font-size="11.5" fill="#C0392B">10.50/16 is via port1</text>
<line x1="732" y1="215" x2="786" y2="215" stroke="#5B6B7C" stroke-width="2" marker-end="url(#k)"/>
<rect x="300" y="344" width="430" height="36" rx="8" fill="#1B2A3A" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="316" y="367" text-anchor="start" font-size="12" fill="#F5A3A3" font-family="Consolas, Menlo, monospace" xml:space="preserve">id=20085 msg="reverse path check fail, drop"</text>
<rect x="30" y="410" width="900" height="270" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="438" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">The options, best first</text>
<rect x="48" y="454" width="864" height="46" rx="8" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<circle cx="72" cy="477" r="13" fill="#2E7D5B"/>
<text x="72" y="482" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="800">1</text>
<text x="96" y="483" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Fix the routing</text>
<text x="440" y="483" text-anchor="start" font-size="12" fill="#1B2A3A">Make traffic return the way it came. The real fix.</text>
<rect x="48" y="508" width="864" height="46" rx="8" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<circle cx="72" cy="531" r="13" fill="#2E7D5B"/>
<text x="72" y="536" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="800">2</text>
<text x="96" y="537" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Add a route via the ingress interface</text>
<text x="440" y="537" text-anchor="start" font-size="12" fill="#1B2A3A">Same distance, higher priority: passes the check, not used to forward</text>
<rect x="48" y="562" width="864" height="46" rx="8" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<circle cx="72" cy="585" r="13" fill="#B35C00"/>
<text x="72" y="590" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="800">3</text>
<text x="96" y="591" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Disable the source check on that interface</text>
<text x="440" y="591" text-anchor="start" font-size="12" fill="#1B2A3A">config system interface / set src-check disable</text>
<rect x="48" y="616" width="864" height="46" rx="8" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<circle cx="72" cy="639" r="13" fill="#C0392B"/>
<text x="72" y="644" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="800">4</text>
<text x="96" y="645" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Enable asymmetric routing</text>
<text x="440" y="645" text-anchor="start" font-size="12" fill="#1B2A3A">set asymroute enable: turns off stateful checks. Test only.</text>
</svg>