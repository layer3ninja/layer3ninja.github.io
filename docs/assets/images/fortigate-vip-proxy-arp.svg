<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B5BA9"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D5B"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="960" height="620" rx="14" fill="#F4F7FA"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#1B2A3A">Two firewalls answering ARP for one public IP</text>
  <text x="40" y="76" font-size="15" fill="#5B6B7C">A staged FortiGate VIP replies to ARP by default</text>

  <rect x="640" y="104" width="280" height="76" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="654" y="128" font-size="13" font-weight="600" fill="#1B2A3A">Router ARP table</text>
  <text x="654" y="150" font-size="13" fill="#8A97A6" text-decoration="line-through">203.0.113.10 → aa:aa (old FW)</text>
  <text x="654" y="170" font-size="13" font-weight="600" fill="#C0392B">203.0.113.10 → bb:bb (FortiGate)</text>
  <line x1="516" y1="166" x2="638" y2="150" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g transform="translate(480,175)">
    <circle r="36" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M-16,-6 L16,-6 M10,-12 L16,-6 L10,0 M16,6 L-16,6 M-10,0 L-16,6 L-10,12" stroke="#1B2A3A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="480" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2A3A">ISP / upstream router</text>

  <line x1="480" y1="211" x2="480" y2="270" stroke="#5B6B7C" stroke-width="3"/>
  <line x1="110" y1="270" x2="850" y2="270" stroke="#5B6B7C" stroke-width="4" stroke-linecap="round"/>
  <text x="290" y="292" font-size="13" fill="#5B6B7C">Outside segment 203.0.113.0/24</text>

  <line x1="470" y1="258" x2="300" y2="258" stroke="#3B5BA9" stroke-width="2" marker-end="url(#aBlue)"/>
  <line x1="490" y1="258" x2="660" y2="258" stroke="#3B5BA9" stroke-width="2" marker-end="url(#aBlue)"/>
  <rect x="496" y="222" width="190" height="24" rx="12" fill="#E7ECF7"/>
  <text x="508" y="239" font-size="13" font-weight="600" fill="#3B5BA9">① Who has 203.0.113.10?</text>

  <line x1="250" y1="270" x2="250" y2="316" stroke="#5B6B7C" stroke-width="3"/>
  <rect x="170" y="316" width="160" height="68" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <path d="M190,338 H310 M190,360 H310 M230,316 V338 M280,338 V360 M215,360 V384 M265,360 V384" stroke="#2E7D5B" stroke-width="1.5" opacity="0.35"/>
  <text x="250" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A3A">Old firewall</text>
  <text x="250" y="406" text-anchor="middle" font-size="13" fill="#5B6B7C">Production · MAC aa:aa</text>

  <line x1="710" y1="270" x2="710" y2="316" stroke="#5B6B7C" stroke-width="3"/>
  <rect x="630" y="316" width="160" height="68" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <path d="M650,338 H770 M650,360 H770 M690,316 V338 M740,338 V360 M675,360 V384 M725,360 V384" stroke="#C0392B" stroke-width="1.5" opacity="0.35"/>
  <text x="710" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A3A">New FortiGate</text>
  <text x="710" y="406" text-anchor="middle" font-size="13" fill="#5B6B7C">Staged VIP · MAC bb:bb</text>
  <line x1="710" y1="416" x2="710" y2="446" stroke="#8A97A6" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="710" y="464" text-anchor="middle" font-size="13" fill="#8A97A6">Inside not live yet</text>

  <path d="M200,316 Q150,200 440,165" fill="none" stroke="#2E7D5B" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="40" y="184" width="150" height="24" rx="12" fill="#E3F1EA"/>
  <text x="52" y="201" font-size="13" font-weight="600" fill="#2E7D5B">② is-at aa:aa</text>

  <path d="M760,316 Q820,210 520,170" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#aRed)"/>
  <rect x="800" y="210" width="128" height="44" rx="12" fill="#F8E3E0"/>
  <text x="812" y="229" font-size="13" font-weight="600" fill="#C0392B">③ is-at bb:bb</text>
  <text x="812" y="246" font-size="12" fill="#C0392B">last reply wins</text>

  <path d="M530,276 Q575,330 626,346" fill="none" stroke="#C0392B" stroke-width="3" marker-end="url(#aRed)"/>
  <rect x="360" y="396" width="236" height="44" rx="12" fill="#F8E3E0"/>
  <text x="372" y="415" font-size="13" font-weight="600" fill="#C0392B">④ Inbound traffic hits FortiGate</text>
  <text x="372" y="432" font-size="12" fill="#C0392B">old NATs go dark</text>

  <line x1="250" y1="416" x2="250" y2="500" stroke="#5B6B7C" stroke-width="3"/>
  <rect x="190" y="500" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <line x1="206" y1="518" x2="294" y2="518" stroke="#8A97A6" stroke-width="2"/>
  <line x1="206" y1="532" x2="294" y2="532" stroke="#8A97A6" stroke-width="2"/>
  <circle cx="286" cy="544" r="3" fill="#2E7D5B"/>
  <text x="250" y="578" text-anchor="middle" font-size="13" fill="#5B6B7C">Web server 10.0.0.10</text>

  <rect x="470" y="484" width="450" height="110" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
  <text x="488" y="510" font-size="14" font-weight="700" fill="#2E7D5B">Fix: stage VIPs silently until cutover</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#1B2A3A">
    <text x="488" y="534">config firewall vip</text>
    <text x="504" y="552">edit "VIP_web"</text>
    <text x="520" y="570">set arp-reply disable</text>
  </g>
  <text x="700" y="570" font-size="12" fill="#5B6B7C">re-enable at cutover</text>
</svg>
