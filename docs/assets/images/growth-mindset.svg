<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="580" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Growth mindset: a useful habit, not a magic switch</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Same situation, two ways to read it</text>

  <rect x="40" y="96" width="880" height="38" rx="8" fill="#E9EDF2"/>
  <g font-size="13" font-weight="700" fill="#5B6B7C">
    <text x="58" y="120">Situation</text><text x="300" y="120" fill="#C0392B">Fixed reading</text><text x="610" y="120" fill="#2E7D5B">Growth reading</text>
  </g>
  <g font-size="13" fill="#1B2A3A">
    <rect x="40" y="142" width="880" height="72" rx="8" fill="#FFFFFF"/>
    <text x="58" y="174" font-weight="700">Failed a certification exam</text>
    <text x="300" y="174">"I'm just not good at this."</text>
    <text x="610" y="168">"Not yet. Which topics did I miss?</text>
    <text x="610" y="188">I'll change how I study them."</text>

    <rect x="40" y="222" width="880" height="72" rx="8" fill="#FFFFFF"/>
    <text x="58" y="254" font-weight="700">My change caused an outage</text>
    <text x="300" y="254">"I'm a bad engineer."</text>
    <text x="610" y="248">"What gap let this through?</text>
    <text x="610" y="268">Fix it, and learn the platform better."</text>

    <rect x="40" y="302" width="880" height="72" rx="8" fill="#FFFFFF"/>
    <text x="58" y="334" font-weight="700">A platform I've never used</text>
    <text x="300" y="334">"Not my area. I'll avoid it."</text>
    <text x="610" y="328">"Lab it, read the docs, and ask</text>
    <text x="610" y="348">someone who knows it."</text>
  </g>
  <line x1="286" y1="142" x2="286" y2="374" stroke="#E2E7ED" stroke-width="2"/>
  <line x1="596" y1="142" x2="596" y2="374" stroke="#E2E7ED" stroke-width="2"/>

  <rect x="40" y="396" width="880" height="164" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="1.5"/>
  <text x="58" y="424" font-size="15" font-weight="700" fill="#3B5BA9">What the research actually says</text>
  <g font-size="13" fill="#1B2A3A">
    <circle cx="66" cy="450" r="4" fill="#3B5BA9"/><text x="80" y="455">Average effects of mindset programs on grades are <tspan font-weight="700">small</tspan>, far smaller than the popular version suggests.</text>
    <circle cx="66" cy="476" r="4" fill="#3B5BA9"/><text x="80" y="481">Effects look larger for <tspan font-weight="700">struggling learners</tspan>, and depend on the environment around them.</text>
    <circle cx="66" cy="502" r="4" fill="#3B5BA9"/><text x="80" y="507">Belief alone isn't enough: it works with <tspan font-weight="700">better strategies, practice and help</tspan>.</text>
    <circle cx="66" cy="528" r="4" fill="#C0392B"/><text x="80" y="533">Never use it to blame people: "you just need a growth mindset" ignores real obstacles.</text>
  </g>
</svg>
