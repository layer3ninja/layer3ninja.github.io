<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="960" height="620" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">Beyond growth mindset: four levers with stronger evidence</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">Believing you can improve helps a little. These are the habits that do the improving.</text>
<rect x="40" y="96" width="200" height="340" rx="12" fill="#F8E3E0" stroke="#C0392B" stroke-width="2"/>
<circle cx="140" cy="138" r="24" fill="#C0392B"/><text x="140" y="147" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">1</text>
<text x="140" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A3A">Learn from errors</text>
<rect x="52" y="204" width="176" height="26" rx="13" fill="#FFFFFF" stroke="#C0392B"/>
<text x="140" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#C0392B">Evidence: Mod. to strong</text>
<text x="58" y="262" font-size="13" fill="#1B2A3A">Lab it, break it on</text>
<text x="58" y="283" font-size="13" fill="#1B2A3A">purpose, fix it without</text>
<text x="58" y="304" font-size="13" fill="#1B2A3A">the answer key.</text>
<text x="58" y="325" font-size="13" fill="#1B2A3A"></text>
<text x="58" y="346" font-size="13" fill="#1B2A3A">Error training: biggest</text>
<text x="58" y="367" font-size="13" fill="#1B2A3A">gains on new problems</text>
<rect x="266" y="96" width="200" height="340" rx="12" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="2"/>
<circle cx="366" cy="138" r="24" fill="#3B5BA9"/><text x="366" y="147" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">2</text>
<text x="366" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A3A">Retrieve and space</text>
<rect x="278" y="204" width="176" height="26" rx="13" fill="#FFFFFF" stroke="#3B5BA9"/>
<text x="366" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#3B5BA9">Evidence: Strong</text>
<text x="284" y="262" font-size="13" fill="#1B2A3A">Close the book and</text>
<text x="284" y="283" font-size="13" fill="#1B2A3A">recall. Lab the same</text>
<text x="284" y="304" font-size="13" fill="#1B2A3A">topic again days later.</text>
<text x="284" y="325" font-size="13" fill="#1B2A3A"></text>
<text x="284" y="346" font-size="13" fill="#1B2A3A">Rereading and</text>
<text x="284" y="367" font-size="13" fill="#1B2A3A">highlighting: low value</text>
<rect x="492" y="96" width="200" height="340" rx="12" fill="#F6E7D2" stroke="#B35C00" stroke-width="2"/>
<circle cx="592" cy="138" r="24" fill="#B35C00"/><text x="592" y="147" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">3</text>
<text x="592" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A3A">Specific goals</text>
<rect x="504" y="204" width="176" height="26" rx="13" fill="#FFFFFF" stroke="#B35C00"/>
<text x="592" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#B35C00">Evidence: Strong</text>
<text x="510" y="262" font-size="13" fill="#1B2A3A">Not "study BGP".</text>
<text x="510" y="283" font-size="13" fill="#1B2A3A">"Build and fix a BGP</text>
<text x="510" y="304" font-size="13" fill="#1B2A3A">lab in 45 min, no</text>
<text x="510" y="325" font-size="13" fill="#1B2A3A">notes." Then get</text>
<text x="510" y="346" font-size="13" fill="#1B2A3A">feedback: a timer,</text>
<text x="510" y="367" font-size="13" fill="#1B2A3A">a peer, a real ticket.</text>
<rect x="718" y="96" width="200" height="340" rx="12" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="2"/>
<circle cx="818" cy="138" r="24" fill="#2E7D5B"/><text x="818" y="147" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">4</text>
<text x="818" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A3A">Earn confidence</text>
<rect x="730" y="204" width="176" height="26" rx="13" fill="#FFFFFF" stroke="#2E7D5B"/>
<text x="818" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D5B">Evidence: Moderate</text>
<text x="736" y="262" font-size="13" fill="#1B2A3A">Confidence mostly</text>
<text x="736" y="283" font-size="13" fill="#1B2A3A">follows success.</text>
<text x="736" y="304" font-size="13" fill="#1B2A3A">Stack small wins,</text>
<text x="736" y="325" font-size="13" fill="#1B2A3A">then raise the</text>
<text x="736" y="346" font-size="13" fill="#1B2A3A">difficulty.</text>
<rect x="40" y="470" width="878" height="122" rx="12" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="62" y="502" font-size="16" font-weight="700" fill="#1B2A3A">And growth mindset?</text>
<text x="62" y="528" font-size="14" fill="#1B2A3A">Large meta-analyses find small average effects, larger for people who are struggling.</text>
<text x="62" y="552" font-size="14" fill="#1B2A3A">"Not yet" is still a useful way to read a failed exam or a bad change. It just needs a method behind it.</text>
<text x="62" y="576" font-size="13" fill="#5B6B7C">Use the belief as the reason to start, and the four levers above as the way to get better.</text>
</svg>