<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A97A6"/></marker></defs>
  <rect width="960" height="600" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Why Site A's route table shows Site B and Site C</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">With Auto VPN, every MX gets the organization's VPN route table from the dashboard</text>

  <!-- dashboard -->
  <rect x="384" y="96" width="200" height="52" rx="26" fill="#FFFFFF" stroke="#5B6B7C" stroke-width="2"/>
  <text x="484" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Meraki dashboard</text>
  <text x="484" y="136" text-anchor="middle" font-size="11" fill="#5B6B7C">global VPN route table</text>
  <path d="M400,148 L190,206" fill="none" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M484,148 L484,206" fill="none" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M568,148 L778,206" fill="none" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- MXs -->
  <g font-size="13">
    <rect x="90" y="210" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
    <text x="180" y="233" text-anchor="middle" font-weight="700" fill="#1B2A3A">Site A · MX</text>
    <text x="180" y="253" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#2E7D5B">10.1.10.0/24</text>
    <rect x="394" y="210" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <text x="484" y="233" text-anchor="middle" font-weight="700" fill="#1B2A3A">Site B · MX</text>
    <text x="484" y="253" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#3B5BA9">10.2.10.0/24</text>
    <rect x="698" y="210" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <text x="788" y="233" text-anchor="middle" font-weight="700" fill="#1B2A3A">Site C · MX</text>
    <text x="788" y="253" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#3B5BA9">10.3.10.0/24</text>
  </g>
  <line x1="272" y1="238" x2="392" y2="238" stroke="#3B5BA9" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="576" y1="238" x2="696" y2="238" stroke="#3B5BA9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="332" y="230" text-anchor="middle" font-size="11" fill="#3B5BA9">Auto VPN</text>
  <text x="636" y="230" text-anchor="middle" font-size="11" fill="#3B5BA9">Auto VPN</text>

  <!-- route table -->
  <text x="40" y="304" font-size="15" font-weight="700" fill="#1B2A3A">Site A · Security &amp; SD-WAN → Monitor → Route table</text>
  <rect x="40" y="316" width="880" height="222" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
  <rect x="40" y="316" width="880" height="32" rx="10" fill="#E9EDF2"/>
  <rect x="40" y="336" width="880" height="12" fill="#E9EDF2"/>
  <g font-size="12" font-weight="700" fill="#5B6B7C">
    <text x="58" y="337">Status</text><text x="130" y="337">Subnet</text><text x="290" y="337">Name</text>
    <text x="490" y="337">Next hop</text><text x="640" y="337">Type</text>
  </g>
  <g font-size="13" fill="#1B2A3A">
    <circle cx="74" cy="370" r="6" fill="#2E7D5B"/>
    <text x="130" y="375" font-family="Consolas, Menlo, monospace" font-size="12">10.1.10.0/24</text><text x="290" y="375">Data VLAN</text><text x="490" y="375">(this MX)</text><text x="640" y="375">Local VLAN</text>
    <rect x="770" y="359" width="134" height="22" rx="11" fill="#E3F1EA"/><text x="837" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D5B">really here</text>

    <line x1="56" y1="392" x2="904" y2="392" stroke="#E9EDF2"/>
    <circle cx="74" cy="412" r="6" fill="#2E7D5B"/>
    <text x="130" y="417" font-family="Consolas, Menlo, monospace" font-size="12">10.2.10.0/24</text><text x="290" y="417">Site B / Data</text><text x="490" y="417">Site B</text><text x="640" y="417">Auto VPN</text>
    <rect x="770" y="401" width="134" height="22" rx="11" fill="#E7ECF7"/><text x="837" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#3B5BA9">another site</text>

    <line x1="56" y1="434" x2="904" y2="434" stroke="#E9EDF2"/>
    <circle cx="74" cy="454" r="6" fill="#2E7D5B"/>
    <text x="130" y="459" font-family="Consolas, Menlo, monospace" font-size="12">10.3.10.0/24</text><text x="290" y="459">Site C / Data</text><text x="490" y="459">Site C</text><text x="640" y="459">Auto VPN</text>
    <rect x="770" y="443" width="134" height="22" rx="11" fill="#E7ECF7"/><text x="837" y="459" text-anchor="middle" font-size="12" font-weight="700" fill="#3B5BA9">another site</text>

    <line x1="56" y1="476" x2="904" y2="476" stroke="#E9EDF2"/>
    <circle cx="74" cy="496" r="6" fill="#2E7D5B"/>
    <text x="130" y="501" font-family="Consolas, Menlo, monospace" font-size="12">0.0.0.0/0</text><text x="290" y="501">Default</text><text x="490" y="501">WAN uplink</text><text x="640" y="501">WAN</text>
    <rect x="770" y="485" width="134" height="22" rx="11" fill="#E9EDF2"/><text x="837" y="501" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6B7C">to the Internet</text>
  </g>

  <g font-size="12">
    <circle cx="46" cy="560" r="6" fill="#2E7D5B"/><text x="58" y="564" fill="#1B2A3A">up and in use</text>
    <circle cx="170" cy="560" r="6" fill="#C0392B"/><text x="182" y="564" fill="#1B2A3A">down</text>
    <circle cx="240" cy="560" r="6" fill="#8A97A6"/><text x="252" y="564" fill="#1B2A3A">a higher-priority route is being used</text>
    <text x="920" y="564" text-anchor="end" font-weight="700" fill="#1B2A3A">Read Next hop and Type, not just Subnet.</text>
  </g>
</svg>
