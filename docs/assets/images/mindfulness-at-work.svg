<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="b" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B5BA9"/></marker><marker id="g" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E7D5B"/></marker><marker id="o" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B35C00"/></marker><marker id="r" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker><marker id="k" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6B7C"/></marker><marker id="t" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1B2A3A"/></marker></defs>
<rect width="960" height="700" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">Mindfulness at work: small practices, honest evidence</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">Awareness of present experience, with acceptance, built into moments that already happen in your day</text>
<rect x="30" y="92" width="900" height="330" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="120" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">Anchors that already exist in a network engineer's day</text>
<line x1="70" y1="250" x2="890" y2="250" stroke="#8A97A6" stroke-width="3"/>
<circle cx="145" cy="250" r="12" fill="#3B5BA9"/>
<rect x="65" y="150" width="160" height="84" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="145" y="174" text-anchor="middle" font-size="13.5" fill="#1B2A3A" font-weight="700">Start of day</text>
<text x="145" y="197" text-anchor="middle" font-size="12.5" fill="#1B2A3A">One minute of breathing</text>
<text x="145" y="216" text-anchor="middle" font-size="11.5" fill="#5B6B7C">before opening the queue</text>
<line x1="145" y1="234" x2="145" y2="238" stroke="#3B5BA9" stroke-width="2"/>
<circle cx="312" cy="250" r="12" fill="#B35C00"/>
<rect x="232" y="285" width="160" height="84" rx="10" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<text x="312" y="309" text-anchor="middle" font-size="13.5" fill="#1B2A3A" font-weight="700">An alert pings</text>
<text x="312" y="332" text-anchor="middle" font-size="12.5" fill="#1B2A3A">One slow breath</text>
<text x="312" y="351" text-anchor="middle" font-size="11.5" fill="#5B6B7C">before you react</text>
<line x1="312" y1="285" x2="312" y2="262" stroke="#B35C00" stroke-width="2"/>
<circle cx="479" cy="250" r="12" fill="#2E7D5B"/>
<rect x="399" y="150" width="160" height="84" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="479" y="174" text-anchor="middle" font-size="13.5" fill="#1B2A3A" font-weight="700">Switch reloading</text>
<text x="479" y="197" text-anchor="middle" font-size="12.5" fill="#1B2A3A">Watch the breath</text>
<text x="479" y="216" text-anchor="middle" font-size="11.5" fill="#5B6B7C">instead of the console</text>
<line x1="479" y1="234" x2="479" y2="238" stroke="#2E7D5B" stroke-width="2"/>
<circle cx="646" cy="250" r="12" fill="#3B5BA9"/>
<rect x="566" y="285" width="160" height="84" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="646" y="309" text-anchor="middle" font-size="13.5" fill="#1B2A3A" font-weight="700">Before a change</text>
<text x="646" y="332" text-anchor="middle" font-size="12.5" fill="#1B2A3A">3-minute breathing space</text>
<text x="646" y="351" text-anchor="middle" font-size="11.5" fill="#5B6B7C">(from MBCT)</text>
<line x1="646" y1="285" x2="646" y2="262" stroke="#3B5BA9" stroke-width="2"/>
<circle cx="813" cy="250" r="12" fill="#2E7D5B"/>
<rect x="733" y="150" width="160" height="84" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="813" y="174" text-anchor="middle" font-size="13.5" fill="#1B2A3A" font-weight="700">After the call</text>
<text x="813" y="197" text-anchor="middle" font-size="12.5" fill="#1B2A3A">Walk slowly</text>
<text x="813" y="216" text-anchor="middle" font-size="11.5" fill="#5B6B7C">to the next task</text>
<line x1="813" y1="234" x2="813" y2="238" stroke="#2E7D5B" stroke-width="2"/>
<rect x="48" y="382" width="864" height="30" rx="6" fill="#F4F7FA" stroke="none" stroke-width="1.5"/>
<text x="480" y="402" text-anchor="middle" font-size="12.5" fill="#1B2A3A">All day: single-task. Attention is like a pie; split it four ways and each task gets a quarter.</text>
<rect x="30" y="440" width="900" height="240" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="468" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">What workplace programs actually do (53 RCTs, Vonderlin et al., 2020)</text>
<text x="48" y="490" text-anchor="start" font-size="12" fill="#5B6B7C">Effect size (Hedges' g) vs. control groups. 0.2 = small, 0.5 = medium, 0.8 = large</text>
<line x1="200" y1="505" x2="200" y2="640" stroke="#8A97A6" stroke-width="1"/>
<text x="200" y="656" text-anchor="middle" font-size="11" fill="#5B6B7C">0</text>
<line x1="304.0" y1="505" x2="304.0" y2="640" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="4 4"/>
<text x="304.0" y="656" text-anchor="middle" font-size="11" fill="#5B6B7C">0.2</text>
<line x1="460.0" y1="505" x2="460.0" y2="640" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="4 4"/>
<text x="460.0" y="656" text-anchor="middle" font-size="11" fill="#5B6B7C">0.5</text>
<line x1="616.0" y1="505" x2="616.0" y2="640" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="4 4"/>
<text x="616.0" y="656" text-anchor="middle" font-size="11" fill="#5B6B7C">0.8</text>
<text x="188" y="529" text-anchor="end" font-size="13" fill="#1B2A3A" font-weight="600">Stress</text>
<rect x="200" y="512" width="343.2" height="22" rx="4" fill="#3B5BA9" stroke="none" stroke-width="1.5"/>
<text x="551.2" y="528" text-anchor="start" font-size="12.5" fill="#3B5BA9" font-weight="700">0.66</text>
<text x="188" y="561" text-anchor="end" font-size="13" fill="#1B2A3A" font-weight="600">Well-being</text>
<rect x="200" y="544" width="353.6" height="22" rx="4" fill="#3B5BA9" stroke="none" stroke-width="1.5"/>
<text x="561.6" y="560" text-anchor="start" font-size="12.5" fill="#3B5BA9" font-weight="700">0.68</text>
<text x="188" y="593" text-anchor="end" font-size="13" fill="#1B2A3A" font-weight="600">Burnout</text>
<rect x="200" y="576" width="192.4" height="22" rx="4" fill="#B35C00" stroke="none" stroke-width="1.5"/>
<text x="400.4" y="592" text-anchor="start" font-size="12.5" fill="#B35C00" font-weight="700">0.37</text>
<text x="188" y="625" text-anchor="end" font-size="13" fill="#1B2A3A" font-weight="600">Productivity</text>
<rect x="200" y="608" width="78.0" height="22" rx="4" fill="#C0392B" stroke="none" stroke-width="1.5"/>
<text x="286.0" y="624" text-anchor="start" font-size="12.5" fill="#C0392B" font-weight="700">0.15</text>
<text x="326.0" y="624" text-anchor="start" font-size="11.5" fill="#5B6B7C" font-style="italic">0.35 with one outlier study; not significant without it</text>
</svg>