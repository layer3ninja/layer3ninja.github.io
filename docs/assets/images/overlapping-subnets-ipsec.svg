<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7C"/></marker>
  </defs>
  <rect width="960" height="520" rx="14" fill="#F4F7FA"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Same subnet on both sides of the tunnel</text>
  <text x="40" y="72" font-size="15" fill="#5B6B7C">Router A translates both directions, so each side only ever sees a unique network</text>

  <!-- Overlap arc -->
  <path d="M135,138 Q480,70 825,138" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="345" y="88" width="270" height="24" rx="12" fill="#F8E3E0"/>
  <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#C0392B">Overlap: 192.168.1.0/24 on both sides</text>

  <!-- Site A -->
  <rect x="40" y="140" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <text x="135" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A3A">Site A LAN</text>
  <text x="135" y="194" text-anchor="middle" font-size="14" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">192.168.1.0/24</text>
  <text x="135" y="228" text-anchor="middle" font-size="12" fill="#5B6B7C">Host A  .10</text>
  <rect x="45" y="262" width="180" height="24" rx="12" fill="#E3F1EA"/>
  <text x="135" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D5B">B sees it as 10.5.5.0/24</text>

  <!-- Site B -->
  <rect x="730" y="140" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <text x="825" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A3A">Site B LAN</text>
  <text x="825" y="194" text-anchor="middle" font-size="14" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">192.168.1.0/24</text>
  <text x="825" y="228" text-anchor="middle" font-size="12" fill="#5B6B7C">Host B  .50</text>
  <rect x="730" y="262" width="190" height="24" rx="12" fill="#E7ECF7"/>
  <text x="825" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#3B5BA9">A sees it as 10.10.10.0/24</text>

  <!-- Links -->
  <line x1="230" y1="195" x2="286" y2="195" stroke="#5B6B7C" stroke-width="3"/>
  <line x1="674" y1="195" x2="730" y2="195" stroke="#5B6B7C" stroke-width="3"/>

  <!-- Tunnel -->
  <rect x="354" y="183" width="252" height="24" fill="#E7ECF7"/>
  <line x1="354" y1="183" x2="606" y2="183" stroke="#3B5BA9" stroke-width="2"/>
  <line x1="354" y1="207" x2="606" y2="207" stroke="#3B5BA9" stroke-width="2"/>
  <g transform="translate(480,195)">
    <rect x="-11" y="-6" width="22" height="16" rx="3" fill="#3B5BA9"/>
    <path d="M-7,-6 V-11 A7,7 0 0 1 7,-11 V-6" fill="none" stroke="#3B5BA9" stroke-width="3"/>
  </g>
  <text x="480" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#3B5BA9">IPsec tunnel over the Internet</text>
  <text x="480" y="232" text-anchor="middle" font-size="12" fill="#5B6B7C">Crypto ACL matches post-NAT addresses</text>
  <text x="480" y="249" text-anchor="middle" font-size="12" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">10.5.5.0/24 ↔ 192.168.1.0/24</text>

  <!-- Router A -->
  <g transform="translate(320,195)">
    <circle r="34" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M-15,-6 L15,-6 M9,-12 L15,-6 L9,0 M15,6 L-15,6 M-9,0 L-15,6 L-9,12" stroke="#1B2A3A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="284" y="134" width="72" height="22" rx="11" fill="#F6E7D2"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#B35C00">NAT × 2</text>
  <text x="320" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A3A">Router A</text>

  <!-- Router B -->
  <g transform="translate(640,195)">
    <circle r="34" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2.5"/>
    <path d="M-15,-6 L15,-6 M9,-12 L15,-6 L9,0 M15,6 L-15,6 M-9,0 L-15,6 L-9,12" stroke="#1B2A3A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A3A">Router B</text>
  <text x="640" y="150" text-anchor="middle" font-size="12" fill="#5B6B7C">no NAT</text>

  <!-- Packet walk -->
  <text x="40" y="326" font-size="15" font-weight="700" fill="#1B2A3A">Packet walk: Host A pings Host B</text>

  <g font-size="13">
    <rect x="40" y="340" width="270" height="104" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
    <text x="56" y="364" font-weight="700" fill="#2E7D5B">① Host A sends</text>
    <text x="56" y="388" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">src 192.168.1.10</text>
    <text x="56" y="408" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">dst 10.10.10.50</text>
    <text x="56" y="432" font-size="12" fill="#5B6B7C">to B's "virtual" address</text>

    <rect x="345" y="340" width="270" height="104" rx="10" fill="#FFFFFF" stroke="#B35C00" stroke-width="2"/>
    <text x="361" y="364" font-weight="700" fill="#B35C00">② After NAT on Router A</text>
    <text x="361" y="388" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">src 10.5.5.10</text>
    <text x="361" y="408" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">dst 192.168.1.50</text>
    <text x="361" y="432" font-size="12" fill="#5B6B7C">matches crypto ACL, gets encrypted</text>

    <rect x="650" y="340" width="270" height="104" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <text x="666" y="364" font-weight="700" fill="#3B5BA9">③ Host B replies</text>
    <text x="666" y="388" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">src 192.168.1.50</text>
    <text x="666" y="408" fill="#1B2A3A" font-family="Consolas, Menlo, monospace">dst 10.5.5.10</text>
    <text x="666" y="432" font-size="12" fill="#5B6B7C">10.5.5.10 isn't local, so it routes</text>
  </g>
  <line x1="312" y1="392" x2="342" y2="392" stroke="#5B6B7C" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="617" y1="392" x2="647" y2="392" stroke="#5B6B7C" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="482" font-size="13" fill="#1B2A3A"><tspan font-weight="700">Key idea:</tspan> neither host ever sends to an address inside its own subnet, so the overlap never</text>
  <text x="40" y="500" font-size="13" fill="#1B2A3A">reaches a routing decision. Router A reverses both translations on the way back.</text>
</svg>
