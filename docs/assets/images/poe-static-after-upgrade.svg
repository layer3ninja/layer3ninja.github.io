<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker>
  </defs>
  <rect width="960" height="640" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Link up, no MAC address: a PoE power problem</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">After the upgrade, the 30 W device was only given 15.4 W. Static power skipped the negotiation.</text>

  <!-- Auto -->
  <rect x="40" y="96" width="430" height="300" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="60" y="126" font-size="16" font-weight="700" fill="#C0392B">power inline auto (after upgrade)</text>
  <rect x="60" y="146" width="130" height="60" rx="8" fill="#F1F3F5" stroke="#5B6B7C"/>
  <text x="125" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Switch</text>
  <text x="125" y="190" text-anchor="middle" font-size="11" fill="#5B6B7C">Gi1/0/10</text>
  <rect x="320" y="146" width="130" height="60" rx="8" fill="#F8E3E0" stroke="#C0392B"/>
  <text x="385" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">PoE device</text>
  <text x="385" y="190" text-anchor="middle" font-size="11" fill="#5B6B7C">Class 4, needs 30 W</text>
  <line x1="190" y1="176" x2="318" y2="176" stroke="#C0392B" stroke-width="3"/>
  <text x="254" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">15.4 W</text>
  <g font-size="12.5" fill="#1B2A3A">
    <text x="60" y="236"><tspan fill="#2E7D5B" font-weight="700">✓</tspan> Detection: device found, port powers on</text>
    <text x="60" y="260"><tspan fill="#2E7D5B" font-weight="700">✓</tspan> Link comes up</text>
    <text x="60" y="284"><tspan fill="#C0392B" font-weight="700">✗</tspan> Class / CDP / LLDP request for 30 W not granted</text>
    <text x="60" y="308"><tspan fill="#C0392B" font-weight="700">✗</tspan> Device never finishes booting (or reboots)</text>
    <text x="60" y="332"><tspan fill="#C0392B" font-weight="700">✗</tspan> No frames, so no MAC address learned</text>
  </g>
  <text x="60" y="372" font-family="Consolas, Menlo, monospace" font-size="12" fill="#C0392B">Gi1/0/10  auto  on  15.4  Ieee PD  4  30.0</text>

  <!-- Static -->
  <rect x="490" y="96" width="430" height="300" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="510" y="126" font-size="16" font-weight="700" fill="#2E7D5B">power inline static</text>
  <rect x="510" y="146" width="130" height="60" rx="8" fill="#F1F3F5" stroke="#5B6B7C"/>
  <text x="575" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Switch</text>
  <text x="575" y="190" text-anchor="middle" font-size="11" fill="#5B6B7C">Gi1/0/10</text>
  <rect x="770" y="146" width="130" height="60" rx="8" fill="#E6F4EE" stroke="#2E7D5B"/>
  <text x="835" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">PoE device</text>
  <text x="835" y="190" text-anchor="middle" font-size="11" fill="#5B6B7C">fully booted</text>
  <line x1="640" y1="176" x2="768" y2="176" stroke="#2E7D5B" stroke-width="5"/>
  <text x="704" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D5B">30 W</text>
  <g font-size="12.5" fill="#1B2A3A">
    <text x="510" y="236"><tspan fill="#2E7D5B" font-weight="700">✓</tspan> Port max reserved up front, no negotiation</text>
    <text x="510" y="260"><tspan fill="#2E7D5B" font-weight="700">✓</tspan> Device boots, sends traffic</text>
    <text x="510" y="284"><tspan fill="#2E7D5B" font-weight="700">✓</tspan> MAC address learned right away</text>
    <text x="510" y="308"><tspan fill="#B35C00" font-weight="700">!</tspan> Always reserves 30 W from the PoE budget,</text>
    <text x="524" y="326">even if the device draws less</text>
  </g>
  <text x="510" y="372" font-family="Consolas, Menlo, monospace" font-size="12" fill="#2E7D5B">Gi1/0/10  static  on  30.0  Ieee PD  4  30.0</text>

  <!-- How auto decides -->
  <rect x="40" y="416" width="880" height="204" rx="12" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
  <text x="60" y="444" font-size="15" font-weight="700" fill="#2B6CB0">How auto mode reaches 30 W, and where an upgrade can break it</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="462" width="230" height="64" rx="8" fill="#EAF1FB" stroke="#2B6CB0"/>
    <text x="175" y="488" font-weight="700" fill="#1B2A3A">1. Detection</text>
    <text x="175" y="508" fill="#5B6B7C">valid PoE device?</text>
    <rect x="345" y="462" width="230" height="64" rx="8" fill="#EAF1FB" stroke="#2B6CB0"/>
    <text x="460" y="488" font-weight="700" fill="#1B2A3A">2. Hardware class</text>
    <text x="460" y="508" fill="#5B6B7C">Class 4 + 2-event → 30 W</text>
    <rect x="630" y="462" width="270" height="64" rx="8" fill="#EAF1FB" stroke="#2B6CB0"/>
    <text x="765" y="488" font-weight="700" fill="#1B2A3A">3. CDP / LLDP-MED request</text>
    <text x="765" y="508" fill="#5B6B7C">device asks, switch grants</text>
  </g>
  <line x1="292" y1="494" x2="342" y2="494" stroke="#2B6CB0" stroke-width="2" marker-end="url(#b)"/>
  <line x1="577" y1="494" x2="627" y2="494" stroke="#2B6CB0" stroke-width="2" marker-end="url(#b)"/>
  <text x="60" y="560" font-size="13" fill="#1B2A3A">If step 2 or 3 fails, the switch falls back to <tspan font-weight="700" fill="#C0392B">15.4 W</tspan>, the safe default.</text>
  <text x="60" y="586" font-size="13" fill="#1B2A3A">Check:</text>
  <text x="112" y="586" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1B2A3A">show power inline gi1/0/10 detail · show lldp neighbors detail · show logging | i ILPOWER</text>
  <text x="60" y="608" font-size="12.5" font-style="italic" fill="#5B6B7C">Cleaner fix first: lldp run, power inline auto max 30000, then bounce PoE.</text>
</svg>
