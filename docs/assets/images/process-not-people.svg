<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="960" height="610" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Outages are a chain, not one mistake</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">The Swiss cheese model (Reason): failure gets through only when the holes in every layer line up</text>
  <text x="60" y="190" font-size="13" font-weight="700" fill="#C0392B">Missing</text>
  <text x="60" y="207" font-size="13" font-weight="700" fill="#C0392B">"add" on</text>
  <text x="60" y="224" font-size="13" font-weight="700" fill="#C0392B">a trunk</text>
  <line x1="132" y1="205" x2="800" y2="205" stroke="#C0392B" stroke-width="3.5" marker-end="url(#r)"/>
  <path d="M200,120 L256,100 L256,290 L200,310 Z M219,205 a9,13 0 1,0 18,0 a9,13 0 1,0 -18,0 Z M221,140 a7,9 0 1,0 14,0 a7,9 0 1,0 -14,0 Z M223,250 a5,7 0 1,0 10,0 a5,7 0 1,0 -10,0 Z" fill="#F6E7D2" fill-rule="evenodd" stroke="#B35C00" stroke-width="1.8"/>
  <text x="228" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Peer review</text>
  <text x="228" y="352" text-anchor="middle" font-size="12" fill="#C0392B">skipped: rushed</text>
  <path d="M350,120 L406,100 L406,290 L350,310 Z M369,205 a9,13 0 1,0 18,0 a9,13 0 1,0 -18,0 Z M373,130 a5,7 0 1,0 10,0 a5,7 0 1,0 -10,0 Z M370,262 a8,10 0 1,0 16,0 a8,10 0 1,0 -16,0 Z" fill="#F6E7D2" fill-rule="evenodd" stroke="#B35C00" stroke-width="1.8"/>
  <text x="378" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Pre-change checklist</text>
  <text x="378" y="352" text-anchor="middle" font-size="12" fill="#C0392B">no trunk check</text>
  <path d="M500,120 L556,100 L556,290 L500,310 Z M519,205 a9,13 0 1,0 18,0 a9,13 0 1,0 -18,0 Z M522,150 a6,8 0 1,0 12,0 a6,8 0 1,0 -12,0 Z M522,255 a6,8 0 1,0 12,0 a6,8 0 1,0 -12,0 Z" fill="#F6E7D2" fill-rule="evenodd" stroke="#B35C00" stroke-width="1.8"/>
  <text x="528" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">Tested rollback</text>
  <text x="528" y="352" text-anchor="middle" font-size="12" fill="#C0392B">not written</text>
  <path d="M650,120 L706,100 L706,290 L650,310 Z M669,205 a9,13 0 1,0 18,0 a9,13 0 1,0 -18,0 Z M670,135 a8,10 0 1,0 16,0 a8,10 0 1,0 -16,0 Z M673,265 a5,7 0 1,0 10,0 a5,7 0 1,0 -10,0 Z" fill="#F6E7D2" fill-rule="evenodd" stroke="#B35C00" stroke-width="1.8"/>
  <text x="678" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A3A">reload in</text>
  <text x="678" y="352" text-anchor="middle" font-size="12" fill="#C0392B">not armed</text>
  <rect x="806" y="180" width="118" height="50" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="2"/>
  <text x="865" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#C0392B">Outage</text>
  <text x="865" y="221" text-anchor="middle" font-size="11" fill="#C0392B">site offline</text>
  <text x="480" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="#1B2A3A">Blaming the engineer closes one hole. Fixing the process closes them for everyone.</text>

  <rect x="40" y="404" width="420" height="186" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="58" y="432" font-size="15" font-weight="700" fill="#C0392B">Who / why: people get defensive</text>
  <g font-size="14" fill="#1B2A3A">
    <text x="58" y="466">"Who made this change?"</text>
    <text x="58" y="496">"Why did you do that?"</text>
    <text x="58" y="526">"Who approved this?"</text>
    <text x="58" y="556">"Didn't you check?"</text>
  </g>
  <rect x="500" y="404" width="420" height="186" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="518" y="432" font-size="15" font-weight="700" fill="#2E7D5B">What / how: people share facts</text>
  <g font-size="14" fill="#1B2A3A">
    <text x="518" y="466">"What changed recently?"</text>
    <text x="518" y="496">"What did you expect to happen?"</text>
    <text x="518" y="526">"How did this get through the process?"</text>
    <text x="518" y="556">"What would have caught this earlier?"</text>
  </g>
  <text x="480" y="504" text-anchor="middle" font-size="22" fill="#5B6B7C">→</text>
</svg>
