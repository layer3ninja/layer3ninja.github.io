<text x="498" y="488" text-anchor="start" font-size="12.5" fill="#1B2A3A"><tspan font-weight='700'>UPS:</tspan> battery + clean power for minutes, until</text>
<text x="498" y="508" text-anchor="start" font-size="12.5" fill="#1B2A3A">generator or graceful shutdown.</text>
<text x="498" y="528" text-anchor="start" font-size="12.5" fill="#1B2A3A"><tspan font-weight='700'>PDU:</tspan> a smart power strip. No battery. Basic,</text>
<text x="498" y="548" text-anchor="start" font-size="12.5" fill="#1B2A3A">metered, monitored or switched (remote on/off).</text>
<text x="498" y="568" text-anchor="start" font-size="12.5" fill="#1B2A3A"><tspan font-weight='700'>Rule:</tspan> both PSUs never on the same PDU, and keep</text>
<text x="498" y="588" text-anchor="start" font-size="12.5" fill="#1B2A3A">each circuit under 80% of its breaker rating.</text>
