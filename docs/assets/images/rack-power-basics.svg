<text x="48" y="560" text-anchor="start" font-size="12.5" fill="#1B2A3A">Square holes take cage nuts (M6 is the most common).</text>
<text x="48" y="580" text-anchor="start" font-size="12.5" fill="#1B2A3A">Order them with the rack and keep a spare bag of 50+.</text>
<text x="48" y="600" text-anchor="start" font-size="12.5" fill="#1B2A3A">Use a cage nut tool, not a screwdriver.</text>
