<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="b" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B5BA9"/></marker><marker id="g" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E7D5B"/></marker><marker id="o" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B35C00"/></marker><marker id="r" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker><marker id="k" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6B7C"/></marker><marker id="t" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1B2A3A"/></marker></defs>
<rect width="960" height="660" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">The new AP that looked like an attacker</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">A technician's new AP broadcast the production SSID before it joined the controller</text>
<rect x="30" y="92" width="900" height="300" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<rect x="60" y="130" width="200" height="70" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="160.0" y="161.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">Managed APs</text>
<text x="160.0" y="180.0" text-anchor="middle" font-size="12" fill="#5B6B7C">joined to the controller</text>
<rect x="60" y="270" width="200" height="70" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="160.0" y="301.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">New AP</text>
<text x="160.0" y="320.0" text-anchor="middle" font-size="12" fill="#5B6B7C">broadcasting "CORP"</text>
<rect x="380" y="190" width="200" height="80" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="480.0" y="226.0" text-anchor="middle" font-size="14" fill="#1B2A3A" font-weight="700">Wireless controller</text>
<text x="480.0" y="245.0" text-anchor="middle" font-size="12" fill="#5B6B7C">rogue detection</text>
<line x1="262" y1="165" x2="376" y2="215" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#g)"/>
<text x="276" y="128" text-anchor="start" font-size="11.5" fill="#5B6B7C">"I can hear an AP</text>
<text x="276" y="143" text-anchor="start" font-size="11.5" fill="#5B6B7C">advertising CORP"</text>
<line x1="262" y1="305" x2="376" y2="250" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<rect x="660" y="130" width="250" height="80" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="785" y="158" text-anchor="middle" font-size="14" fill="#C0392B" font-weight="700">Classified: rogue</text>
<text x="785" y="180" text-anchor="middle" font-size="12" fill="#1B2A3A">using our SSID</text>
<text x="785" y="198" text-anchor="middle" font-size="12" fill="#5B6B7C">(an impersonator)</text>
<rect x="660" y="240" width="250" height="110" rx="10" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<text x="785" y="266" text-anchor="middle" font-size="14" fill="#B35C00" font-weight="700">Impact</text>
<text x="785" y="290" text-anchor="middle" font-size="12" fill="#1B2A3A">clients connect to the wrong AP</text>
<text x="785" y="310" text-anchor="middle" font-size="12" fill="#1B2A3A">auto-containment sends deauths</text>
<text x="785" y="330" text-anchor="middle" font-size="12" fill="#1B2A3A">alarms and a security response</text>
<line x1="582" y1="215" x2="656" y2="175" stroke="#C0392B" stroke-width="2.5" marker-end="url(#r)"/>
<line x1="582" y1="245" x2="656" y2="290" stroke="#B35C00" stroke-width="2.5" marker-end="url(#o)"/>
<rect x="30" y="410" width="900" height="230" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="438" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">Provisioning new APs without the drama</text>
<rect x="48" y="456" width="424" height="72" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="66" y="486" text-anchor="start" font-size="14" fill="#1B2A3A" font-weight="700">Stage it first</text>
<text x="66" y="508" text-anchor="start" font-size="12" fill="#5B6B7C">join the AP to the controller before it broadcasts anything</text>
<rect x="488" y="456" width="424" height="72" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="506" y="486" text-anchor="start" font-size="14" fill="#1B2A3A" font-weight="700">No production SSID</text>
<text x="506" y="508" text-anchor="start" font-size="12" fill="#5B6B7C">use a temporary staging SSID, or none at all</text>
<rect x="48" y="542" width="424" height="72" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="66" y="572" text-anchor="start" font-size="14" fill="#1B2A3A" font-weight="700">Tell the wireless team</text>
<text x="66" y="594" text-anchor="start" font-size="12" fill="#5B6B7C">so a new rogue alert isn't treated as an attack</text>
<rect x="488" y="542" width="424" height="72" rx="10" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<text x="506" y="572" text-anchor="start" font-size="14" fill="#1B2A3A" font-weight="700">Check containment rules</text>
<text x="506" y="594" text-anchor="start" font-size="12" fill="#5B6B7C">auto-contain only what you own and have verified</text>
</svg>