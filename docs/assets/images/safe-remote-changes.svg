<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B7C"/></marker>
  </defs>
  <rect width="960" height="580" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">A safety net for every remote change</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Schedule the rollback before you touch the config</text>

  <!-- Flow -->
  <g font-size="13" fill="#1B2A3A">
    <rect x="40" y="110" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <text x="115" y="140" text-anchor="middle" font-weight="700" fill="#3B5BA9">1 · Back up</text>
    <text x="115" y="162" text-anchor="middle">save config +</text>
    <text x="115" y="178" text-anchor="middle">"before" outputs</text>

    <rect x="220" y="110" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <text x="295" y="140" text-anchor="middle" font-weight="700" fill="#3B5BA9">2 · Arm the net</text>
    <text x="295" y="166" text-anchor="middle" font-family="Consolas, Menlo, monospace">reload in 10</text>

    <rect x="400" y="110" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <text x="475" y="140" text-anchor="middle" font-weight="700" fill="#3B5BA9">3 · Change</text>
    <text x="475" y="162" text-anchor="middle">conf t …</text>
    <text x="475" y="178" text-anchor="middle">(don't save yet)</text>

    <path d="M650,105 L715,150 L650,195 L585,150 Z" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
    <text x="650" y="146" text-anchor="middle" font-weight="700">Still have</text>
    <text x="650" y="162" text-anchor="middle" font-weight="700">access?</text>

    <rect x="750" y="110" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
    <text x="835" y="134" text-anchor="middle" font-weight="700" fill="#2E7D5B">4 · Yes: verify</text>
    <text x="835" y="156" text-anchor="middle" font-family="Consolas, Menlo, monospace">reload cancel</text>
    <text x="835" y="174" text-anchor="middle" font-family="Consolas, Menlo, monospace">copy run start</text>

    <rect x="560" y="236" width="360" height="76" rx="10" fill="#FFFFFF" stroke="#B35C00" stroke-width="2.5"/>
    <text x="578" y="261" font-weight="700" fill="#B35C00">No: locked out</text>
    <text x="578" y="281">The switch reloads itself and boots the</text>
    <text x="578" y="299">saved config. You're back in.</text>
  </g>
  <line x1="192" y1="150" x2="216" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="372" y1="150" x2="396" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="552" y1="150" x2="582" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="717" y1="150" x2="746" y2="150" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="197" x2="650" y2="232" stroke="#5B6B7C" stroke-width="2" marker-end="url(#a)"/>
  <text x="726" y="142" font-size="12" fill="#2E7D5B">yes</text>
  <text x="658" y="220" font-size="12" fill="#B35C00">no</text>
  <text x="40" y="236" font-size="12" fill="#C0392B" font-weight="600">Save too early and the net is gone:</text>
  <text x="40" y="254" font-size="12" fill="#C0392B">the reload brings back the broken config.</text>

  <!-- Window -->
  <text x="40" y="332" font-size="15" font-weight="700" fill="#1B2A3A">Plan the window: reserve real time for rollback</text>
  <g font-size="12" font-weight="600">
    <rect x="40" y="370" width="73" height="50" fill="#E7ECF7"/><text x="76" y="400" text-anchor="middle" fill="#3B5BA9">Pre</text>
    <rect x="113" y="370" width="330" height="50" fill="#D7E2F4"/><text x="278" y="400" text-anchor="middle" fill="#3B5BA9">Implement</text>
    <rect x="443" y="370" width="110" height="50" fill="#E3F1EA"/><text x="498" y="400" text-anchor="middle" fill="#2E7D5B">Test</text>
    <rect x="553" y="370" width="220" height="50" fill="#F6E7D2"/><text x="663" y="400" text-anchor="middle" fill="#B35C00">Rollback (if needed)</text>
    <rect x="773" y="370" width="147" height="50" fill="#E9EDF2"/><text x="846" y="400" text-anchor="middle" fill="#5B6B7C">Buffer</text>
  </g>
  <rect x="40" y="370" width="880" height="50" fill="none" stroke="#5B6B7C" stroke-width="1.5"/>
  <line x1="553" y1="356" x2="553" y2="432" stroke="#C0392B" stroke-width="3"/>
  <rect x="490" y="340" width="126" height="22" rx="11" fill="#F8E3E0"/>
  <text x="553" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">Go / no-go 2:20</text>
  <g font-size="12" fill="#5B6B7C" text-anchor="middle">
    <text x="40" y="446">0:00</text><text x="113" y="446">0:20</text><text x="443" y="446">1:50</text>
    <text x="553" y="446">2:20</text><text x="773" y="446">3:20</text><text x="920" y="446">4:00</text>
  </g>

  <!-- Rules -->
  <g font-size="13" fill="#1B2A3A">
    <rect x="40" y="474" width="280" height="76" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
    <text x="58" y="500" font-weight="700">Write rollback steps first</text>
    <text x="58" y="522">Not at 2 a.m. under pressure.</text>

    <rect x="340" y="474" width="280" height="76" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
    <text x="358" y="500" font-weight="700">Fix the go/no-go time</text>
    <text x="358" y="522">Decide it before you start,</text>
    <text x="358" y="540">and don't push past it.</text>

    <rect x="640" y="474" width="280" height="76" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
    <text x="658" y="500" font-weight="700">Promise less than you have</text>
    <text x="658" y="522">Book 4 h, aim to finish in 2.</text>
  </g>
</svg>
