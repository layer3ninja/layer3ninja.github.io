<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D5B"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="960" height="590" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">When the routes don't fit in hardware</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">The switch keeps learning routes, but only the ones that fit in TCAM are forwarded in hardware</text>

  <rect x="40" y="104" width="200" height="190" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="2"/>
  <text x="140" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1B2A3A">Routing table</text>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#5B6B7C">(software, RAM)</text>
  <g fill="#8A97A6">
    <rect x="62" y="166" width="156" height="10" rx="3"/><rect x="62" y="182" width="156" height="10" rx="3"/>
    <rect x="62" y="198" width="156" height="10" rx="3"/><rect x="62" y="214" width="156" height="10" rx="3"/>
    <rect x="62" y="230" width="156" height="10" rx="3"/>
  </g>
  <text x="140" y="270" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#1B2A3A">12,000 routes</text>

  <line x1="242" y1="190" x2="312" y2="190" stroke="#5B6B7C" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="316" y="104" width="300" height="190" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
  <text x="466" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#3B5BA9">TCAM (hardware)</text>
  <text x="466" y="150" text-anchor="middle" font-size="12" fill="#5B6B7C">fixed size, carved up by the SDM template</text>
  <rect x="336" y="168" width="234" height="44" rx="6" fill="#E3F1EA" stroke="#2E7D5B"/>
  <text x="453" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D5B">11,000 routes: fits</text>
  <rect x="570" y="168" width="40" height="44" rx="6" fill="#F8E3E0" stroke="#C0392B" stroke-dasharray="4 3"/>
  <text x="590" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#C0392B">+1K</text>
  <text x="466" y="240" text-anchor="middle" font-size="12" fill="#1B2A3A">Example: Catalyst 3750 "desktop routing"</text>
  <text x="466" y="258" text-anchor="middle" font-size="12" fill="#1B2A3A">template holds about 11K unicast routes</text>

  <line x1="618" y1="176" x2="690" y2="140" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="694" y="104" width="226" height="74" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2"/>
  <text x="710" y="132" font-size="14" font-weight="700" fill="#2E7D5B">Hardware forwarding</text>
  <text x="710" y="154" font-size="12" fill="#1B2A3A">Line rate, low CPU</text>
  <line x1="618" y1="204" x2="690" y2="246" stroke="#C0392B" stroke-width="2.5" marker-end="url(#r)"/>
  <rect x="694" y="216" width="226" height="78" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="710" y="244" font-size="14" font-weight="700" fill="#C0392B">Software (CPU) switching</text>
  <text x="710" y="266" font-size="12" fill="#1B2A3A">Slow traffic, high CPU,</text>
  <text x="710" y="282" font-size="12" fill="#1B2A3A">sometimes drops</text>

  <text x="40" y="340" font-size="15" font-weight="700" fill="#1B2A3A">Same switch, different template (Catalyst 3750 desktop, unicast routes)</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="40" y="378">sdm prefer vlan</text>
    <rect x="230" y="364" width="4" height="22" fill="#C0392B"/>
    <text x="244" y="380" font-weight="700" fill="#C0392B">0 routes: every routed packet goes to the CPU</text>
    <text x="40" y="420">sdm prefer default</text>
    <rect x="230" y="406" width="436" height="22" rx="4" fill="#3B5BA9"/>
    <text x="676" y="422" font-weight="700">8K</text>
    <text x="40" y="462">sdm prefer routing</text>
    <rect x="230" y="448" width="600" height="22" rx="4" fill="#2E7D5B"/>
    <text x="840" y="464" font-weight="700">11K</text>
  </g>
  <rect x="40" y="496" width="880" height="72" rx="10" fill="#FFFFFF" stroke="#B35C00" stroke-width="1.5"/>
  <text x="58" y="522" font-size="13" font-weight="700" fill="#B35C00">Changing the template needs a reload.</text>
  <text x="58" y="544" font-size="13" fill="#1B2A3A">More space for routes means less for MAC addresses or ACLs. Check show sdm prefer for the trade-offs first.</text>
</svg>
