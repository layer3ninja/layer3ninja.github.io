<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="680" rx="14" fill="#F4F7FA"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">The topic pyramid and the TALK maxims</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">From Alison Wood Brooks' Talk. Example: meeting a new colleague from the server team</text>

  <!-- Climb arrow -->
  <line x1="48" y1="452" x2="48" y2="118" stroke="#3B5BA9" stroke-width="3"/>
  <path d="M38 132 L48 112 L58 132 Z" fill="#3B5BA9"/>
  <text transform="translate(76 285) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="#3B5BA9">Climb with follow-up questions</text>

  <!-- Pyramid tiers: apex (300,100), base y=460, x 80..520 -->
  <polygon points="300,100 373.3,220 226.7,220" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="2"/>
  <polygon points="226.7,220 373.3,220 446.7,340 153.3,340" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="2"/>
  <polygon points="153.3,340 446.7,340 520,460 80,460" fill="#F6E7D2" stroke="#B35C00" stroke-width="2"/>

  <text x="300" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#2E7D5B">Deep talk</text>
  <text x="300" y="207" text-anchor="middle" font-size="11" fill="#1B2A3A">only this group</text>
  <text x="300" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#3B5BA9">Tailored talk</text>
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#1B2A3A">many groups could discuss, not all</text>
  <text x="300" y="403" text-anchor="middle" font-size="16" font-weight="700" fill="#B35C00">Small talk</text>
  <text x="300" y="424" text-anchor="middle" font-size="12" fill="#1B2A3A">any group could discuss</text>

  <!-- Connectors -->
  <line x1="352" y1="170" x2="556" y2="160" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="420" y1="282" x2="556" y2="280" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="490" y1="402" x2="556" y2="400" stroke="#8A97A6" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Example boxes -->
  <rect x="556" y="112" width="364" height="96" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/>
  <text x="574" y="138" font-size="13" font-weight="700" fill="#2E7D5B">Deep</text>
  <text x="574" y="162" font-size="13" fill="#1B2A3A">"What got you into infrastructure work?"</text>
  <text x="574" y="186" font-size="13" fill="#1B2A3A">"What's the hardest part of on-call for you?"</text>

  <rect x="556" y="232" width="364" height="96" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="1.5"/>
  <text x="574" y="258" font-size="13" font-weight="700" fill="#3B5BA9">Tailored</text>
  <text x="574" y="282" font-size="13" fill="#1B2A3A">"Are you on the data center migration too?"</text>
  <text x="574" y="306" font-size="13" fill="#1B2A3A">"How's the new monitoring tool working for you?"</text>

  <rect x="556" y="352" width="364" height="96" rx="10" fill="#FFFFFF" stroke="#B35C00" stroke-width="1.5"/>
  <text x="574" y="378" font-size="13" font-weight="700" fill="#B35C00">Small</text>
  <text x="574" y="402" font-size="13" fill="#1B2A3A">"Busy week so far?"</text>
  <text x="574" y="426" font-size="13" fill="#1B2A3A">"How was the drive in?"</text>

  <!-- TALK strip -->
  <rect x="40" y="490" width="200" height="160" rx="12" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="2"/>
  <text x="60" y="534" font-size="38" font-weight="800" fill="#3B5BA9">T</text>
  <text x="92" y="530" font-size="16" font-weight="700" fill="#1B2A3A">Topics</text>
  <text x="58" y="568" font-size="13" fill="#1B2A3A"><tspan x="58" dy="0">Prepare a few. Climb</tspan><tspan x="58" dy="19">the pyramid. Switch</tspan><tspan x="58" dy="19">when it goes flat.</tspan></text>

  <rect x="266" y="490" width="200" height="160" rx="12" fill="#F6E7D2" stroke="#B35C00" stroke-width="2"/>
  <text x="286" y="534" font-size="38" font-weight="800" fill="#B35C00">A</text>
  <text x="318" y="530" font-size="16" font-weight="700" fill="#1B2A3A">Asking</text>
  <text x="284" y="568" font-size="13" fill="#1B2A3A"><tspan x="284" dy="0">Ask more questions,</tspan><tspan x="284" dy="19">especially follow-ups</tspan><tspan x="284" dy="19">on what they just said.</tspan></text>

  <rect x="492" y="490" width="200" height="160" rx="12" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="2"/>
  <text x="512" y="534" font-size="38" font-weight="800" fill="#2E7D5B">L</text>
  <text x="540" y="530" font-size="16" font-weight="700" fill="#1B2A3A">Levity</text>
  <text x="510" y="568" font-size="13" fill="#1B2A3A"><tspan x="510" dy="0">Keep it light. Warmth</tspan><tspan x="510" dy="19">and humor, never at</tspan><tspan x="510" dy="19">someone's expense.</tspan></text>

  <rect x="718" y="490" width="200" height="160" rx="12" fill="#F8E3E0" stroke="#C0392B" stroke-width="2"/>
  <text x="738" y="534" font-size="38" font-weight="800" fill="#C0392B">K</text>
  <text x="768" y="530" font-size="16" font-weight="700" fill="#1B2A3A">Kindness</text>
  <text x="736" y="568" font-size="13" fill="#1B2A3A"><tspan x="736" dy="0">Put their needs first.</tspan><tspan x="736" dy="19">Disagree with HEAR:</tspan><tspan x="736" dy="19">hedge, agree,</tspan><tspan x="736" dy="19">acknowledge, reframe.</tspan></text>
</svg>
