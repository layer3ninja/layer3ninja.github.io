<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="b" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3B5BA9"/></marker><marker id="g" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2E7D5B"/></marker><marker id="o" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B35C00"/></marker><marker id="r" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C0392B"/></marker><marker id="k" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B6B7C"/></marker><marker id="t" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1B2A3A"/></marker></defs>
<rect width="960" height="670" rx="14" fill="#F4F7FA"/>
<text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1B2A3A">Tracking down a machine, hop by hop</text>
<text x="480" y="70" text-anchor="middle" font-size="14" fill="#5B6B7C">From an IP address to the wall jack: ARP gives the MAC, the MAC table gives the port, CDP/LLDP gives the next switch</text>
<circle cx="48" cy="120" r="14" fill="#3B5BA9"/>
<text x="48" y="125" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">1</text>
<rect x="72" y="96" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="157" y="125" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">Gateway (L3 switch)</text>
<rect x="256" y="96" width="420" height="48" rx="8" fill="#1B2A3A" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="272" y="125" text-anchor="start" font-size="12.5" fill="#E7ECF7" font-family="Consolas, Menlo, monospace" xml:space="preserve">show ip arp 10.10.10.25</text>
<line x1="678" y1="120" x2="700" y2="120" stroke="#3B5BA9" stroke-width="2.5" marker-end="url(#b)"/>
<rect x="704" y="96" width="226" height="48" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="817" y="125" text-anchor="middle" font-size="12.5" fill="#1B2A3A" font-weight="600">MAC 0000.5e00.5311</text>
<circle cx="48" cy="182" r="14" fill="#B35C00"/>
<text x="48" y="187" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">2</text>
<rect x="72" y="158" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="157" y="187" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">Core switch</text>
<rect x="256" y="158" width="420" height="48" rx="8" fill="#1B2A3A" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="272" y="187" text-anchor="start" font-size="12.5" fill="#E7ECF7" font-family="Consolas, Menlo, monospace" xml:space="preserve">show mac address-table address 0000.5e00.5311</text>
<line x1="678" y1="182" x2="700" y2="182" stroke="#B35C00" stroke-width="2.5" marker-end="url(#o)"/>
<rect x="704" y="158" width="226" height="48" rx="10" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<text x="817" y="187" text-anchor="middle" font-size="12.5" fill="#1B2A3A" font-weight="600">Gi1/0/48: a trunk, keep going</text>
<circle cx="48" cy="244" r="14" fill="#B35C00"/>
<text x="48" y="249" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">3</text>
<rect x="72" y="220" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="157" y="249" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">Core switch</text>
<rect x="256" y="220" width="420" height="48" rx="8" fill="#1B2A3A" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="272" y="249" text-anchor="start" font-size="12.5" fill="#E7ECF7" font-family="Consolas, Menlo, monospace" xml:space="preserve">show cdp neighbors Gi1/0/48 detail</text>
<line x1="678" y1="244" x2="700" y2="244" stroke="#B35C00" stroke-width="2.5" marker-end="url(#o)"/>
<rect x="704" y="220" width="226" height="48" rx="10" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/>
<text x="817" y="249" text-anchor="middle" font-size="12.5" fill="#1B2A3A" font-weight="600">next switch: ACCESS-SW2</text>
<circle cx="48" cy="306" r="14" fill="#2E7D5B"/>
<text x="48" y="311" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">4</text>
<rect x="72" y="282" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="157" y="311" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">ACCESS-SW2</text>
<rect x="256" y="282" width="420" height="48" rx="8" fill="#1B2A3A" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="272" y="311" text-anchor="start" font-size="12.5" fill="#E7ECF7" font-family="Consolas, Menlo, monospace" xml:space="preserve">show mac address-table address 0000.5e00.5311</text>
<line x1="678" y1="306" x2="700" y2="306" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#g)"/>
<rect x="704" y="282" width="226" height="48" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="817" y="311" text-anchor="middle" font-size="12.5" fill="#1B2A3A" font-weight="600">Gi1/0/14: access port</text>
<circle cx="48" cy="368" r="14" fill="#2E7D5B"/>
<text x="48" y="373" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">5</text>
<rect x="72" y="344" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="157" y="373" text-anchor="middle" font-size="13" fill="#1B2A3A" font-weight="700">ACCESS-SW2</text>
<rect x="256" y="344" width="420" height="48" rx="8" fill="#1B2A3A" stroke="#1B2A3A" stroke-width="1.5"/>
<text x="272" y="373" text-anchor="start" font-size="12.5" fill="#E7ECF7" font-family="Consolas, Menlo, monospace" xml:space="preserve">show interfaces Gi1/0/14 status</text>
<line x1="678" y1="368" x2="700" y2="368" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#g)"/>
<rect x="704" y="344" width="226" height="48" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="817" y="373" text-anchor="middle" font-size="12.5" fill="#1B2A3A" font-weight="600">description: patch panel B-14</text>
<text x="48" y="420" text-anchor="start" font-size="12" fill="#5B6B7C" font-style="italic">Shortcut: with DHCP snooping on, show ip dhcp snooping binding on the access switch gives IP, MAC, VLAN and port in one line.</text>
<rect x="30" y="440" width="900" height="212" rx="10" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
<text x="48" y="468" text-anchor="start" font-size="15" fill="#1B2A3A" font-weight="700">Why moving cables "doesn't work": tables remember the old location</text>
<rect x="48" y="486" width="276" height="150" rx="10" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/>
<text x="64" y="512" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Switch MAC table</text>
<text x="64" y="548" text-anchor="start" font-size="26" fill="#3B5BA9" font-weight="800">5 minutes</text>
<text x="64" y="568" text-anchor="start" font-size="11.5" fill="#5B6B7C">default aging (Cisco)</text>
<text x="64" y="594" text-anchor="start" font-size="12" fill="#1B2A3A">Relearns the moment the device sends a</text>
<text x="64" y="611" text-anchor="start" font-size="12" fill="#1B2A3A">frame; silent devices stay stale.</text>
<rect x="344" y="486" width="276" height="150" rx="10" fill="#F8E3E0" stroke="#C0392B" stroke-width="1.5"/>
<text x="360" y="512" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Router / switch ARP</text>
<text x="360" y="548" text-anchor="start" font-size="26" fill="#C0392B" font-weight="800">4 hours</text>
<text x="360" y="568" text-anchor="start" font-size="11.5" fill="#5B6B7C">default timeout (Cisco IOS)</text>
<text x="360" y="594" text-anchor="start" font-size="12" fill="#1B2A3A">Replaced hardware with the same IP?</text>
<text x="360" y="611" text-anchor="start" font-size="12" fill="#1B2A3A">Traffic still goes to the old MAC.</text>
<rect x="640" y="486" width="276" height="150" rx="10" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="1.5"/>
<text x="656" y="512" text-anchor="start" font-size="13.5" fill="#1B2A3A" font-weight="700">Windows ARP cache</text>
<text x="656" y="548" text-anchor="start" font-size="26" fill="#2E7D5B" font-weight="800">~15 to 45 s</text>
<text x="656" y="568" text-anchor="start" font-size="11.5" fill="#5B6B7C">reachable time</text>
<text x="656" y="594" text-anchor="start" font-size="12" fill="#1B2A3A">Short, but hosts on the same subnet can</text>
<text x="656" y="611" text-anchor="start" font-size="12" fill="#1B2A3A">briefly keep using the old MAC.</text>
</svg>