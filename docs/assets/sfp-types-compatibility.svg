<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="590" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Picking the right optic: three checks</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Get all three right, on both ends of the link</text>

  <g font-size="13" fill="#1B2A3A">
    <rect x="40" y="96" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <circle cx="68" cy="124" r="15" fill="#3B5BA9"/><text x="68" y="129" text-anchor="middle" font-weight="700" fill="#FFFFFF">1</text>
    <text x="92" y="130" font-size="15" font-weight="700" fill="#3B5BA9">Speed and cage</text>
    <text x="58" y="164">SFP · 1 Gbps</text>
    <text x="58" y="184">SFP+ · 10 Gbps</text>
    <text x="58" y="204">SFP28 · 25 Gbps</text>
    <text x="58" y="224">QSFP+ / QSFP28 · 40 / 100 Gbps</text>

    <rect x="340" y="96" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="2"/>
    <circle cx="368" cy="124" r="15" fill="#3B5BA9"/><text x="368" y="129" text-anchor="middle" font-weight="700" fill="#FFFFFF">2</text>
    <text x="392" y="130" font-size="15" font-weight="700" fill="#3B5BA9">Media and reach</text>
    <text x="358" y="164">Multimode fiber → SR (850 nm)</text>
    <text x="358" y="184">Single-mode → LR / ER / ZR</text>
    <text x="358" y="204">Copper → DAC or RJ45</text>
    <text x="358" y="224">One strand → BiDi (in pairs)</text>

    <rect x="640" y="96" width="280" height="150" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
    <circle cx="668" cy="124" r="15" fill="#2E7D5B"/><text x="668" y="129" text-anchor="middle" font-weight="700" fill="#FFFFFF">3</text>
    <text x="692" y="130" font-size="15" font-weight="700" fill="#2E7D5B">Supported here?</text>
    <text x="658" y="164">Check the vendor's matrix:</text>
    <text x="658" y="184">this device model + this optic</text>
    <text x="658" y="204">+ <tspan font-weight="700">minimum software version</tspan></text>
    <text x="658" y="224" fill="#5B6B7C" font-size="12">The column people forget.</text>
  </g>

  <text x="40" y="292" font-size="15" font-weight="700" fill="#1B2A3A">Typical reach at 10 Gbps</text>
  <text x="262" y="292" font-size="12" fill="#5B6B7C">(log scale)</text>
  <g stroke="#D7DEE6" stroke-width="1">
    <line x1="230" y1="306" x2="230" y2="512"/><line x1="358" y1="306" x2="358" y2="512"/>
    <line x1="486" y1="306" x2="486" y2="512"/><line x1="614" y1="306" x2="614" y2="512"/>
    <line x1="742" y1="306" x2="742" y2="512"/><line x1="870" y1="306" x2="870" y2="512"/>
  </g>
  <g font-size="13" fill="#1B2A3A">
    <text x="40" y="324">DAC (passive)</text><rect x="230" y="311" width="89" height="18" rx="4" fill="#8A97A6"/><text x="327" y="325" font-size="12" fill="#5B6B7C">~5 m</text>
    <text x="40" y="352">10GBASE-T (RJ45)</text><rect x="230" y="339" width="189" height="18" rx="4" fill="#8A97A6"/><text x="427" y="353" font-size="12" fill="#5B6B7C">30 m</text>
    <text x="40" y="380">SR on OM3</text><rect x="230" y="367" width="317" height="18" rx="4" fill="#B35C00"/><text x="555" y="381" font-size="12" fill="#5B6B7C">300 m</text>
    <text x="40" y="408">SR on OM4</text><rect x="230" y="395" width="333" height="18" rx="4" fill="#B35C00"/><text x="571" y="409" font-size="12" fill="#5B6B7C">400 m</text>
    <text x="40" y="436">LR</text><rect x="230" y="423" width="512" height="18" rx="4" fill="#3B5BA9"/><text x="750" y="437" font-size="12" fill="#5B6B7C">10 km</text>
    <text x="40" y="464">ER</text><rect x="230" y="451" width="589" height="18" rx="4" fill="#3B5BA9"/><text x="827" y="465" font-size="12" fill="#5B6B7C">40 km</text>
    <text x="40" y="492">ZR</text><rect x="230" y="479" width="628" height="18" rx="4" fill="#3B5BA9"/><text x="866" y="493" font-size="12" fill="#5B6B7C">80 km</text>
  </g>
  <g font-size="11" fill="#5B6B7C" text-anchor="middle">
    <text x="230" y="528">1 m</text><text x="358" y="528">10 m</text><text x="486" y="528">100 m</text>
    <text x="614" y="528">1 km</text><text x="742" y="528">10 km</text><text x="870" y="528">100 km</text>
  </g>
  <g font-size="12">
    <rect x="40" y="546" width="12" height="12" rx="2" fill="#8A97A6"/><text x="58" y="557" fill="#1B2A3A">Copper</text>
    <rect x="130" y="546" width="12" height="12" rx="2" fill="#B35C00"/><text x="148" y="557" fill="#1B2A3A">Multimode fiber (aqua jacket)</text>
    <rect x="350" y="546" width="12" height="12" rx="2" fill="#3B5BA9"/><text x="368" y="557" fill="#1B2A3A">Single-mode fiber (yellow jacket)</text>
  </g>
</svg>
