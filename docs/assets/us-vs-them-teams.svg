<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="960" height="560" rx="14" fill="#F4F7FA"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B2A3A">Draw a line, and people take sides</text>
  <text x="40" y="74" font-size="15" fill="#5B6B7C">Even trivial groups create "us vs them". The fix is a bigger "we".</text>

  <!-- panel 1 -->
  <rect x="40" y="96" width="280" height="370" rx="12" fill="#FFFFFF" stroke="#8A97A6" stroke-width="1.5"/>
  <text x="58" y="126" font-size="15" font-weight="700" fill="#1B2A3A">1 · The experiment</text>
  <text x="58" y="146" font-size="12" fill="#5B6B7C">Tajfel and colleagues, 1971</text>
  <circle cx="115" cy="215" r="46" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="2"/>
  <text x="115" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#3B5BA9">"Klee</text>
  <text x="115" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#3B5BA9">fans"</text>
  <circle cx="245" cy="215" r="46" fill="#F6E7D2" stroke="#B35C00" stroke-width="2"/>
  <text x="245" y="211" text-anchor="middle" font-size="12" font-weight="700" fill="#B35C00">"Kandinsky</text>
  <text x="245" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#B35C00">fans"</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="58" y="296">Groups based on a trivial</text>
    <text x="58" y="314">painting preference.</text>
    <text x="58" y="346">Still, people gave more to</text>
    <text x="58" y="364">their own group, and often</text>
    <text x="58" y="382">chose to <tspan font-weight="700">beat</tspan> the other group</text>
    <text x="58" y="400">over gaining the most.</text>
  </g>

  <!-- panel 2 -->
  <rect x="340" y="96" width="280" height="370" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
  <text x="358" y="126" font-size="15" font-weight="700" fill="#C0392B">2 · At work</text>
  <text x="358" y="146" font-size="12" fill="#5B6B7C">During an incident</text>
  <circle cx="420" cy="205" r="38" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="2"/>
  <text x="420" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#3B5BA9">Network</text>
  <circle cx="545" cy="205" r="38" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="2"/>
  <text x="545" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D5B">Servers</text>
  <circle cx="482" cy="315" r="38" fill="#F6E7D2" stroke="#B35C00" stroke-width="2"/>
  <text x="482" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#B35C00">Security</text>
  <line x1="508" y1="196" x2="460" y2="196" stroke="#C0392B" stroke-width="2" marker-end="url(#r)"/>
  <line x1="463" y1="290" x2="438" y2="242" stroke="#C0392B" stroke-width="2" marker-end="url(#r)"/>
  <line x1="502" y1="290" x2="527" y2="242" stroke="#C0392B" stroke-width="2" marker-end="url(#r)"/>
  <g font-size="12" font-weight="700" fill="#C0392B">
    <text x="482" y="168" text-anchor="middle">"It's the network"</text>
    <text x="360" y="374">"It's the firewall"</text>
    <text x="604" y="374" text-anchor="end">"It's the app"</text>
  </g>
  <g font-size="13" fill="#1B2A3A">
    <text x="358" y="410">Each team defends its own</text>
    <text x="358" y="428">box. The incident waits.</text>
  </g>

  <!-- panel 3 -->
  <rect x="640" y="96" width="280" height="370" rx="12" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="658" y="126" font-size="15" font-weight="700" fill="#2E7D5B">3 · A bigger "we"</text>
  <text x="658" y="146" font-size="12" fill="#5B6B7C">One shared goal</text>
  <ellipse cx="780" cy="262" rx="118" ry="80" fill="#E3F1EA" stroke="#2E7D5B" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="735" cy="225" r="28" fill="#E7ECF7" stroke="#3B5BA9" stroke-width="1.5"/><text x="735" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#3B5BA9">Network</text>
  <circle cx="825" cy="225" r="28" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.5"/><text x="825" y="229" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D5B">Servers</text>
  <circle cx="780" cy="283" r="28" fill="#F6E7D2" stroke="#B35C00" stroke-width="1.5"/><text x="780" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#B35C00">Security</text>
  <text x="780" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D5B">"We run the service"</text>
  <g font-size="13" fill="#1B2A3A">
    <text x="658" y="388">One bridge, one timeline,</text>
    <text x="658" y="406">one goal: restore service.</text>
  </g>

  <rect x="40" y="486" width="880" height="54" rx="10" fill="#FFFFFF" stroke="#3B5BA9" stroke-width="1.5"/>
  <text x="58" y="510" font-size="13" font-weight="700" fill="#3B5BA9">The good news:</text>
  <text x="58" y="528" font-size="13" fill="#1B2A3A">research suggests the bias is mostly favouring "us", not attacking "them", so redrawing the group works.</text>
</svg>
